<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ninja Road: Street Fighter</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
    <style>
        body{font-family:'Courier New',monospace;background:#1a1a1a;color:#fff;text-align:center;margin:0;overflow:hidden}
        #menu-screen{padding:10px;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow-y:auto}
        .stats-container{background:#2d2d2d;border:2px solid #ff4757;padding:10px;border-radius:10px;margin-bottom:15px;width:85%;max-width:320px}
        .btn{background:#ff4757;color:#fff;border:none;padding:12px 25px;font-size:16px;font-weight:bold;border-radius:5px;cursor:pointer;margin:5px;width:85%;max-width:320px}
        .btn-ad{background:#ffa502}
        .selection-title{margin-top:12px;font-size:15px;color:#ffa502}
        .grid-container{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
        .card-box{border:2px dashed #555;padding:8px;background:#2d2d2d;border-radius:5px;cursor:pointer;font-size:12px;width:90px}
        .selected{border-color:#ff4757!important;background:#4a151b!important}
        .unlocked{border-color:#2ed573!important;background:#1e3d2f!important}
        #game-container{display:none;width:100vw;height:100vh}
    </style>
</head>
<body>

<div id="menu-screen">
    <h1>🥷 NINJA ROAD 🥷</h1>
    <div class="stats-container">
        <h3>Ninja: <span id="ninja-name">Ninja</span></h3>
        <p>⭐ Nivel: <span id="ninja-level">1</span> (<span id="ninja-xp">0</span>/100)</p>
        <p>🪙 Monedas: <span id="ninja-coins">20</span></p>
    </div>
    <div class="selection-title">🥋 ELIGE GUERRERO 🥋</div>
    <div class="grid-container" id="characters-grid">
        <div id="char-shadow" class="card-box selected" onclick="selectCharacter('shadow')">🟠 NARANJA<br>Base</div>
        <div id="char-blaze" class="card-box" onclick="unlockOrSelectCharacter('blaze',50)">🔵 AZUL<br>🪙 50</div>
        <div id="char-storm" class="card-box" onclick="unlockOrSelectCharacter('storm',150)">🩷 ROSADO<br>🪙 150</div>
    </div>
    <div class="selection-title">🏯 DOJO 🏯</div>
    <div class="grid-container" id="stages-grid">
        <div id="stage-0" class="card-box selected" onclick="selectStage(0)">🏯 Templo<br>Libre</div>
        <div id="stage-1" class="card-box" onclick="unlockOrSelectStage(1,100)">🌋 Volcán<br>🪙 100</div>
    </div>
    <button class="btn" onclick="startFight()">🥊 PELEAR</button>
    <button class="btn btn-ad" onclick="watchAdForCoins()">📺 +50 Monedas</button>
</div>

<div id="game-container"></div>

<script>
const tg = window.Telegram?.WebApp; if(tg){tg.expand(); tg.ready();}
let playerState={name:tg?.initDataUnsafe?.user?.first_name||"Ninja",level:1,xp:0,coins:20,selectedCharacter:'shadow',unlockedCharacters:['shadow'],selectedStage:0,unlockedStages:[0]};
const charRow={shadow:0, blaze:1, storm:2, green:3};
const stageColors={0:0x2c3e50,1:0x5a1a1a};

function updateUI(){
    document.getElementById('ninja-name').innerText=playerState.name;
    document.getElementById('ninja-level').innerText=playerState.level;
    document.getElementById('ninja-xp').innerText=playerState.xp;
    document.getElementById('ninja-coins').innerText=playerState.coins;
}
updateUI();

function selectCharacter(id){
    if(!playerState.unlockedCharacters.includes(id)) return;
    playerState.selectedCharacter=id;
    document.querySelectorAll('#characters-grid .card-box').forEach(e=>e.classList.remove('selected'));
    document.getElementById('char-'+id).classList.add('selected');
}
function unlockOrSelectCharacter(id,cost){
    if(playerState.unlockedCharacters.includes(id)){selectCharacter(id);return;}
    if(playerState.coins>=cost){playerState.coins-=cost;playerState.unlockedCharacters.push(id);selectCharacter(id);updateUI();}
    else alert("Sin monedas");
}
function selectStage(id){
    if(!playerState.unlockedStages.includes(id)) return;
    playerState.selectedStage=id;
    document.querySelectorAll('#stages-grid .card-box').forEach(e=>e.classList.remove('selected'));
    document.getElementById('stage-'+id).classList.add('selected');
}
function unlockOrSelectStage(id,cost){
    if(playerState.unlockedStages.includes(id)){selectStage(id);return;}
    if(playerState.coins>=cost){playerState.coins-=cost;playerState.unlockedStages.push(id);selectStage(id);updateUI();}
    else alert("Sin monedas");
}
function watchAdForCoins(){playerState.coins+=50;updateUI();}
function startFight(){
    document.getElementById('menu-screen').style.display='none';
    document.getElementById('game-container').style.display='block';
    initPhaserGame();
}

function initPhaserGame(){
    const config={type:Phaser.AUTO,width:window.innerWidth,height:window.innerHeight,parent:'game-container',physics:{default:'arcade',arcade:{gravity:{y:800},debug:false}},scene:{preload,create,update}};
    const game=new Phaser.Game(config);
    let player,enemy,ground,playerBar,enemyBar;
    let playerHealth=100,enemyHealth=100;
    let moveLeft=false,moveRight=false,isAttacking=false,cursors;

    function preload(){
        // TU SPRITESHEET DE 4 PERSONAJES x 4 FRAMES
        this.load.spritesheet('ninjas_anim','./ninjas_anim.png',{frameWidth:128,frameHeight:128});
    }

    function create(){
        const w=this.cameras.main.width,h=this.cameras.main.height;
        this.add.rectangle(w/2,h/2,w,h,stageColors[playerState.selectedStage]);
        ground=this.add.rectangle(w/2,h-35,w,70,0x0f0f0f); this.physics.add.existing(ground,true);

        let sel=playerState.selectedCharacter;
        let row=charRow[sel]||0; let base=row*4;

        // Crear animaciones para tu personaje
        this.anims.create({key:'idle_'+sel,frames:[{key:'ninjas_anim',frame:base}],frameRate:5});
        this.anims.create({key:'walk_'+sel,frames:this.anims.generateFrameNumbers('ninjas_anim',{start:base,start:base,end:base+1}),frameRate:8,repeat:-1});
        this.anims.create({key:'jump_'+sel,frames:[{key:'ninjas_anim',frame:base+2}]});
        this.anims.create({key:'punch_'+sel,frames:[{key:'ninjas_anim',frame:base+3}]});

        player=this.physics.add.sprite(w*0.25,h-120,'ninjas_anim',base);
        player.setScale(0.7).setCollideWorldBounds(true).setSize(60,80);
        player.play('idle_'+sel);

        let enemyChar=sel==='shadow'?'blaze':'shadow';
        let eRow=charRow[enemyChar]; let eBase=eRow*4;
        if(!this.anims.exists('idle_'+enemyChar)){
            this.anims.create({key:'idle_'+enemyChar,frames:[{key:'ninjas_anim',frame:eBase}]});
            this.anims.create({key:'walk_'+enemyChar,frames:this.anims.generateFrameNumbers('ninjas_anim',{start:eBase,end:eBase+1}),frameRate:8,repeat:-1});
            this.anims.create({key:'punch_'+enemyChar,frames:[{key:'ninjas_anim',frame:eBase+3}]});
        }
        enemy=this.physics.add.sprite(w*0.75,h-120,'ninjas_anim',eBase);
        enemy.setScale(0.7).setCollideWorldBounds(true).setSize(60,80);
        enemy.play('idle_'+enemyChar); enemy.flipX=true;

        this.physics.add.collider(player,ground); this.physics.add.collider(enemy,ground);
        playerBar=this.add.graphics(); enemyBar=this.add.graphics();

        let bL=this.add.text(25,h-70,'◀',{font:'48px Arial'}).setInteractive();
        bL.on('pointerdown',()=>moveLeft=true); bL.on('pointerup',()=>{moveLeft=false;}); bL.on('pointerout',()=>{moveLeft=false;});
        let bR=this.add.text(115,h-70,'▶',{font:'48px Arial'}).setInteractive();
        bR.on('pointerdown',()=>moveRight=true); bR.on('pointerup',()=>{moveRight=false;}); bR.on('pointerout',()=>{moveRight=false;});
        let bP=this.add.text(w-90,h-70,'🥊',{font:'44px Arial'}).setInteractive();
        bP.on('pointerdown',()=>doPunch.call(this,sel,eBase,enemyChar));

        cursors=this.input.keyboard.createCursorKeys();
        this.input.keyboard.on('keydown-SPACE',()=>doPunch.call(this,sel,eBase,enemyChar));
        this.input.keyboard.on('keydown-UP',()=>{if(player.body.onFloor()) player.body.setVelocityY(-380);});
    }

    function doPunch(sel,eBase,enemyChar){
        if(isAttacking) return; isAttacking=true;
        player.play('punch_'+sel);
        let d=Phaser.Math.Distance.Between(player.x,player.y,enemy.x,enemy.y);
        if(d<90){enemyHealth-=18; enemy.play('punch_'+enemyChar); enemy.x+=(enemy.x>player.x?20:-20);}
        this.time.delayedCall(300,()=>{isAttacking=false;});
    }

    function update(){
        if(playerHealth<=0||enemyHealth<=0) return;
        let sel=playerState.selectedCharacter;
        if(moveLeft||cursors.left.isDown){player.body.setVelocityX(-200); player.flipX=true; if(player.body.onFloor()&&!isAttacking) player.play('walk_'+sel,true);}
        else if(moveRight||cursors.right.isDown){player.body.setVelocityX(200); player.flipX=false; if(player.body.onFloor()&&!isAttacking) player.play('walk_'+sel,true);}
        else {player.body.setVelocityX(0); if(player.body.onFloor()&&!isAttacking) player.play('idle_'+sel,true);}
        if(!player.body.onFloor()) player.play('jump_'+sel,true);

        if(enemyHealth>0){
            if(enemy.x>player.x+70){enemy.body.setVelocityX(-90); enemy.flipX=false; enemy.play('walk_'+(sel==='shadow'?'blaze':'shadow'),true);}
            else if(enemy.x<player.x-70){enemy.body.setVelocityX(90); enemy.flipX=true; enemy.play('walk_'+(sel==='shadow'?'blaze':'shadow'),true);}
            else {enemy.body.setVelocityX(0); if(Phaser.Math.Between(1,40)===5){playerHealth-=10;}}
        }
        playerBar.clear(); playerBar.fillStyle(0x2ed573,1); playerBar.fillRect(20,45,Math.max(0,playerHealth)*1.4,14);
        enemyBar.clear(); enemyBar.fillStyle(0xff4757,1); enemyBar.fillRect(window.innerWidth-160,45,Math.max(0,enemyHealth)*1.4,14);

        if(enemyHealth<=0||playerHealth<=0){
            this.physics.pause(); let won=enemyHealth<=0;
            if(won){playerState.xp+=35;playerState.coins+=15;if(playerState.xp>=100){playerState.level++;playerState.xp=0;}}
            this.add.text(this.cameras.main.width/2-90,this.cameras.main.height/2,won?"¡VICTORIA!":"K.O.",{font:'bold 32px Arial',backgroundColor:'#000',padding:{x:12,y:8}});
            this.time.delayedCall(2500,()=>{game.destroy(true);document.getElementById('game-container').style.display='none';document.getElementById('menu-screen').style.display='flex';updateUI();});
        }
    }
}
</script>
</body>
</html>
