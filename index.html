<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RATONOCELA INFIERNO 3528410</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(d,z,s){
  s=d.createElement('script');
  s.src='https://alwingulla.com/88/tag.min.js';
  s.setAttribute('data-zone', z);
  (d.head||d.documentElement).appendChild(s);
})(document,'3528410');
</script>
<style>
body{margin:0;background:#000;color:#f00;font-family:Courier New;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}
#hud{width:320px;display:flex;justify-content:space-between;padding:10px 5px;font-weight:900;font-size:13px}
canvas{border:3px solid #f00;background:#000;box-shadow:0 0 20px #f00a}
.controls{display:grid;grid-template-columns:70px 70px 70px;gap:12px;margin-top:12px}
.controls button{height:62px;background:#200;border:2px solid #f00;color:#f00;font-size:26px;border-radius:12px}
#money{color:#0f0;font-size:11px;margin-top:6px;text-align:center}
</style>
</head>
<body>
<div id="hud"><span id="score">SCORE 0</span><span id="lvl">LVL1 INFIERNO</span><span id="deaths">MUERTES:0</span></div>
<canvas id="game" width="320" height="480"></canvas>
<div id="money">ID 3528410 ACTIVO - CADA MUERTE = $$$</div>
<div class="controls">
<button id="left">◀</button>
<button id="fire">🔥</button>
<button id="right">▶</button>
</div>
<script>
const tg=Telegram.WebApp; tg.ready(); tg.expand();
let score=0,level=1,deaths=0,gameOver=false;
let player={x:150,y:440,speed:3.5}, bullets=[], enemies=[], enemyBullets=[], particles=[], keys={};
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
function spawn(){ enemies=[]; for(let r=0;r<6;r++) for(let c=0;c<10;c++) enemies.push({x:10+c*30,y:30+r*22,w:16,h:10,dir:1,alive:true}); }
spawn();
function shoot(){ if(gameOver) return; bullets.push({x:player.x+6,y:player.y,vy:-9}); }
function triggerAd(){
  deaths++; document.getElementById('deaths').innerText='MUERTES:'+deaths;
  document.getElementById('money').innerText='MOSTRANDO ANUNCIO 3528410...';
  try{ if(window.monetag) monetag.show(); }catch(e){}
  setTimeout(()=>{ gameOver=false; level++; document.getElementById('lvl').innerText='LVL'+level+' INFIERNO'; document.getElementById('money').innerText='ID 3528410 PAGADO - NIVEL '+level; bullets=[]; enemyBullets=[]; player.x=150; spawn(); },2000);
}
function endGame(){
  gameOver=true; tg.HapticFeedback.notificationOccurred('error');
  tg.showPopup({title:'💀 MORISTE LVL '+level, message:'Score:'+score+' | Muertes:'+deaths+' - Tu anuncio 3528410 se disparará', buttons:[{id:'ad',type:'default',text:'💰 VER ANUNCIO 3528410 Y REVIVIR'}]});
  tg.onPopupButtonClicked=(d)=>{ if(d.buttonId==='ad') triggerAd(); };
}
function update(){
  if(gameOver) return;
  if(keys['left']) player.x-=player.speed; if(keys['right']) player.x+=player.speed;
  player.x=Math.max(0,Math.min(304,player.x));
  bullets.forEach((b,i)=>{ b.y+=b.vy; if(b.y<0) bullets.splice(i,1); });
  let edge=false, spd=1+level*0.9;
  enemies.forEach(e=>{ if(!e.alive) return; e.x+=e.dir*spd; if(e.x<2||e.x>302) edge=true; });
  if(edge) enemies.forEach(e=>{ e.dir*=-1; e.y+=20; });
  enemyBullets.forEach((b,i)=>{ b.y+=b.vy; if(b.y>480) enemyBullets.splice(i,1); if(b.x>player.x&&b.x<player.x+16&&b.y>player.y&&b.y<player.y+12){ endGame(); enemyBullets.splice(i,1); } });
  bullets.forEach((b,bi)=>{ enemies.forEach(e=>{ if(!e.alive) return; if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){ e.alive=false; bullets.splice(bi,1); score+=150; document.getElementById('score').innerText='SCORE '+score; for(let k=0;k<4;k++) particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:12}); } }); });
  if(enemies.every(e=>!e.alive)){ level++; document.getElementById('lvl').innerText='LVL'+level+' INFIERNO'; spawn(); }
  if(enemies.some(e=>e.alive&&e.y>400)) endGame();
}
function draw(){
  ctx.clearRect(0,0,320,480); ctx.fillStyle='rgba(255,0,0,0.05)'; for(let y=0;y<480;y+=3) ctx.fillRect(0,y,320,1);
  ctx.fillStyle='#0ff'; ctx.fillRect(player.x,player.y,16,3); ctx.fillRect(player.x+6,player.y-6,4,8);
  ctx.fillStyle='#ff0'; bullets.forEach(b=>ctx.fillRect(b.x,b.y,2,10));
  ctx.fillStyle='#f00'; enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,3,10));
  enemies.forEach(e=>{ if(!e.alive) return; ctx.fillStyle='#f00'; ctx.fillRect(e.x,e.y,16,6); ctx.fillRect(e.x+2,e.y+6,3,4); ctx.fillRect(e.x+11,e.y+6,3,4); });
  particles.forEach((p,i)=>{ p.x+=p.vx; p.y+=p.vy; p.life--; if(p.life<=0) particles.splice(i,1); else {ctx.fillStyle='#fff'; ctx.fillRect(p.x,p.y,2,2);} });
}
function loop(){ update(); draw(); requestAnimationFrame(loop); } loop();
document.getElementById('left').ontouchstart=()=>keys['left']=true; document.getElementById('left').ontouchend=()=>keys['left']=false;
document.getElementById('right').ontouchstart=()=>keys['right']=true; document.getElementById('right').ontouchend=()=>keys['right']=false;
document.getElementById('fire').ontouchstart=()=>shoot();
document.addEventListener('keydown',e=>{keys[e.key]=true; if(e.code==='Space') shoot();});
document.addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{ if(gameOver) return; let alive=enemies.filter(e=>e.alive); if(!alive.length) return; for(let i=0;i<4;i++){ let e=alive[Math.floor(Math.random()*alive.length)]; enemyBullets.push({x:e.x+6,y:e.y+10,vy:4+level*0.6}); } },300);
</script>
</body>
</html>
