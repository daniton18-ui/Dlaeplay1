<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DalePlay - Pago Triple</title>

<!-- 1. MONETAG - PAGA POR SOLO VER (sin click) -->
<script src='//libtl.com/sdk.js' data-zone='12010449' data-sdk='show_12010449'></script>

<!-- 2. ADSTERRA SOCIAL BAR - PAGA POR SOLO VER (ID 31686426) -->
<script>
  // Adsterra Social Bar - tu ID
  (function(){
    var s = document.createElement('script');
    s.src = 'https://www.profitablecpmgate.com/31686426/invoke.js';
    s.async = true;
    document.head.appendChild(s);
  })();
</script>

<style>
body{margin:0;background:#000;font-family:Arial;overflow:hidden}
video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
#box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:85%;max-width:320px;background:rgba(15,15,15,0.98);border:2px solid #00ff66;border-radius:15px;padding:15px;z-index:999;display:none}
#top{display:flex;justify-content:space-between;align-items:center;color:#00ff66;font-weight:bold}
#x{background:red;color:white;border:none;width:30px;height:30px;border-radius:50%;font-weight:bold;cursor:pointer;font-size:16px}
#msg{color:white;font-size:13px;margin:10px 0}
#bar{height:4px;background:#333;border-radius:10px;overflow:hidden}
#fill{height:100%;background:#00ff66;width:0%;transition:width .1s}
</style>
</head>
<body>

<video autoplay controls playsinline loop id="vid">
<source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
</video>

<div id="box">
  <div id="top">
    <span>🎁 RECLAMA BONO</span>
    <button id="x" onclick="cerrarConPago()">X</button>
  </div>
  <div id="msg">Cierra para seguir viendo y ganar</div>
  <div id="bar"><div id="fill"></div></div>
</div>

<script>
// Links que pagan al dar click en la X
const directLinks = [
  "https://auctionr.org/4/78daf4a997a4fba4301f10f56752d9b3",
  "https://uplcm.com/4/12009180"
];
let li = 0;
let prog = 0;

function mostrarBox(){
  document.getElementById('box').style.display = 'block';
  prog = 0;
  // PAGO 1 y 2: POR VISTA AUTOMÁTICO
  if(typeof show_12010449 === 'function') show_12010449();
  // El Social Bar 31686426 ya se muestra solo
}

function cerrarConPago(){
  // PAGO 3: POR CLICK EN LA X
  window.open(directLinks[li % directLinks.length], '_blank');
  li++;
  document.getElementById('box').style.display = 'none';
}

// Modo historia - cada 22 seg
setInterval(()=>{
  prog += 1.5;
  document.getElementById('fill').style.width = prog + '%';
  if(prog >= 100){
    mostrarBox();
    prog = 0;
  }
}, 200);

setTimeout(mostrarBox, 4000); // primer anuncio a los 4 seg
</script>

</body>
</html>
