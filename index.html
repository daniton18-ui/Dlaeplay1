<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Duel 1000 + Tienda</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<script src="//libtl.com/sdk.js" data-zone="12010451" data-sdk="show_12010451"></script>
<style>
 body{margin:0;background:#000;color:#fff;font-family:monospace;text-align:center;overflow:hidden}
 canvas{background:radial-gradient(#0a0a1a,#000);display:block;margin:0 auto;border:2px solid #222;border-radius:12px}
 #stats{display:flex;justify-content:space-between;padding:8px 10px;background:#111;margin:5px;border-radius:10px;font-size:12px}
 #controls{display:flex;justify-content:center;gap:8px;margin:6px}
 .ctrl{width:72px;height:72px;background:#1c1c1c;border:2px solid #333;border-radius:16px;font-size:26px;color:#fff}
 .ctrl:active{background:#2ea6ff}
 #fire{width:100px;background:#ff2d55;border-color:#ff2d55}
 #gameover,#levelup,#shop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);display:none;flex-direction:column;justify-content:flex-start;align-items:center;z-index:50;padding-top:20px;overflow-y:auto}
 #gameover.show,#levelup.show,#shop.show{display:flex}
 button.action{padding:14px;width:90%;max-width:330px;background:#2ea6ff;border:0;border-radius:14px;color:#fff;font-weight:bold;margin:6px;font-size:15px}
 button.gold{background:linear-gradient(90deg,#ffb700,#ff8a00)}
 .shipCard{width:90%;max-width:340px;background:#151515;border:2px solid #333;border-radius:14px;padding:10px;margin:8px;display:flex;justify-content:space-between;align-items:center}
 .shipCard.owned{border-color:#00f5ff} .shipCard.active{border-color:#0f0;background:#0f1a0f}
 #progress{width:90%;height:6px;background:#222;border-radius:10px;margin:4px auto;overflow:hidden}
 #bar{height:100%;background:linear-gradient(90deg,#00f5ff,#2ea6ff);width:0%}
</style>
</head>
<body>
<div id="stats">
  <span>❤️ <b id="vidaP">3</b></span>
  <span>LVL <b id="nivel">1</b>/1000</span>
  <span>💰 <b id="coins">0</b></span>
  <span>🤖 <b id="vidaM">5</b></span>
</div>
<div id="progress"><div id="bar"></div></div>
<canvas id="game" width="340" height="420"></canvas>
<div id="controls">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="shopBtn">🛒</button>
  <button class="ctrl" id="fire">🔥</button>
  <button class="ctrl" id="right">▶</button>
</div>

<div id="levelup"><h2 id="lvlTitle">NIVEL SUPERADO</h2><p>+<span id="rewardCoins">20</span> monedas</p></div>

<div id="gameover">
  <h2>PERDISTE</h2><p>Nivel <b id="overLvl">1</b> | Monedas <b id="overCoins">0</b></p>
  <button class="action" id="btnRevive">🎥 Revivir viendo anuncio</button>
  <button class="action gold" onclick="addCoinsAd()">🎥 +50 monedas con anuncio</button>
  <button class="action" style="background:#333" onclick="location.reload()">Reiniciar</button>
</div>

<div id="shop">
  <h2>🛒 TIENDA DE NAVES</h2>
  <p>Monedas: <b id="shopCoins">0</b></p>
  <div id="ships"></div>
  <button class="action gold" onclick="addCoinsAd()">🎥 Ver anuncio +50 monedas (12010449)</button>
  <button class="action" style="background:#333" onclick="document.getElementById('shop').classList.remove('show')">Cerrar</button>
</div>

<script>
const tg=Telegram.WebApp; tg.ready(); tg.expand();
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let nivel=parseInt(localStorage.getItem('nivel')||'1'), coins=parseInt(localStorage.getItem('coins')||'0');
let player={x:155,y:380,w:30,h:20,vida:3}, enemy, bullets=[], eBullets=[], running=true;

const NAVES=[
 {id:0,name:"Básica",price:0,speed:28,shots:1,color:"#00f5ff"},
 {id:1,name:"Rápida",price:150,speed:40,shots:1,color:"#00ff88"},
 {id:2,name:"Doble",price:400,speed:32,shots:2,color:"#ffcc00"},
 {id:3,name:"Destructor",price:1000,speed:38,shots:3,color:"#ff2dff"},
];
let naveActual=parseInt(localStorage.getItem('nave')||'0');
let owned=JSON.parse(localStorage.getItem('owned')||'[0]');

function save(){ localStorage.setItem('coins',coins); localStorage.setItem('nivel',nivel); localStorage.setItem('nave',naveActual); localStorage.setItem('owned',JSON.stringify(owned)); updateUI(); }
function updateUI(){ document.getElementById('coins').innerText=coins; document.getElementById('shopCoins').innerText=coins; document.getElementById('nivel').innerText=nivel; document.getElementById('bar').style.width=(Math.min(nivel,1000)/1000*100)+"%"; }

function crearEnemigo(){
  let esJefe=nivel%10===0;
  let vida=3+Math.floor(nivel*0.7)*(esJefe?2:1);
  enemy={x:140,y:45,w:esJefe?52:34,h:esJefe?32:24,vida,maxVida:vida,dir:1.5+nivel*0.12,esJefe,shootRate:0.025+nivel*0.0025};
  document.getElementById('vidaM').innerText=vida;
}

function draw(){
  ctx.clearRect(0,0,340,420);
  let n=NAVES[naveActual];
  ctx.fillStyle=n.color; ctx.shadowColor=n.color; ctx.shadowBlur=12;
  ctx.fillRect(player.x,player.y,player.w,player.h); ctx.fillRect(player.x+8,player.y-6,14,6);
  ctx.shadowBlur=0;
  ctx.fillStyle=enemy.esJefe?"#ffaa00":"#ff2d55"; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=enemy.esJefe?16:8;
  ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h); ctx.shadowBlur=0;
  if(enemy.esJefe){ ctx.fillStyle="#333"; ctx.fillRect(20,8,300,6); ctx.fillStyle="#ffaa00"; ctx.fillRect(20,8,300*(enemy.vida/enemy.maxVida),6); }
  ctx.fillStyle="#fff"; bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
  ctx.fillStyle="#ffcc00"; eBullets.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
}

function loop(){
  if(!running) return;
  enemy.x+=enemy.dir; if(enemy.x<0||enemy.x>340-enemy.w) enemy.dir*=-1;
  if(Math.random()<enemy.shootRate){ if(enemy.esJefe){ eBullets.push({x:enemy.x+5,y:enemy.y+enemy.h,dy:3+nivel*0.05}); eBullets.push({x:enemy.x+enemy.w-9,y:enemy.y+enemy.h,dy:3+nivel*0.05}); } eBullets.push({x:enemy.x+enemy.w/2,y:enemy.y+enemy.h,dy:3.5+nivel*0.1}); }
  bullets.forEach(b=>b.y-=8); eBullets.forEach(b=>b.y+=b.dy);
  bullets=bullets.filter(b=>b.y>-20); eBullets=eBullets.filter(b=>b.y<450);
  bullets.forEach((b,i)=>{ if(b.x>enemy.x&&b.x<enemy.x+enemy.w&&b.y>enemy.y&&b.y<enemy.y+enemy.h){ bullets.splice(i,1); enemy.vida--; document.getElementById('vidaM').innerText=Math.max(0,enemy.vida); if(enemy.vida<=0) ganar(); }});
  eBullets.forEach((b,i)=>{ if(b.x>player.x&&b.x<player.x+player.w&&b.y>player.y&&b.y<player.y+player.h){ eBullets.splice(i,1); player.vida--; document.getElementById('vidaP').innerText=Math.max(0,player.vida); if(player.vida<=0) perder(); }});
  draw(); requestAnimationFrame(loop);
}

function ganar(){
  running=false; let reward=20+Math.floor(nivel/5)*5; if(enemy.esJefe) reward*=2; coins+=reward;
  document.getElementById('lvlTitle').innerText=`NIVEL ${nivel} SUPERADO`; document.getElementById('rewardCoins').innerText=reward;
  document.getElementById('levelup').classList.add('show'); save();
  setTimeout(()=>{ if(typeof show_12010451==='function'){ show_12010451().then(nextLevel).catch(nextLevel); } else nextLevel(); },700);
}
function nextLevel(){ document.getElementById('levelup').classList.remove('show'); nivel++; if(nivel>1000) nivel=1000; player.x=155; bullets=[]; eBullets=[]; player.vida=3; document.getElementById('vidaP').innerText=3; crearEnemigo(); save(); running=true; loop(); }
function perder(){ running=false; document.getElementById('overLvl').innerText=nivel; document.getElementById('overCoins').innerText=coins; document.getElementById('gameover').classList.add('show'); save(); }

function shoot(){
  let n=NAVES[naveActual];
  if(n.shots===1) bullets.push({x:player.x+13,y:player.y-8});
  if(n.shots===2){ bullets.push({x:player.x+3,y:player.y-8}); bullets.push({x:player.x+23,y:player.y-8}); }
  if(n.shots>=3){ bullets.push({x:player.x+3,y:player.y-8}); bullets.push({x:player.x+13,y:player.y-8}); bullets.push({x:player.x+23,y:player.y-8}); }
}

function addCoinsAd(){
  if(typeof show_12010449==='function'){
    show_12010449().then(()=>{ coins+=50; save(); alert('+50 monedas!'); }).catch(()=>alert('Anuncio no disponible'));
  } else alert('SDK cargando');
}

// Tienda render
function renderShop(){
  let html='';
  NAVES.forEach(n=>{
    let isOwned=owned.includes(n.id), isActive=naveActual===n.id;
    html+=`<div class="shipCard ${isOwned?'owned':''} ${isActive?'active':''}">
      <div><b>${n.name}</b><br><small>${n.shots} disparo | vel ${n.speed}</small></div>
      <div>${isOwned ? (isActive ? '<b>✅ ACTIVA</b>' : `<button class="action" style="width:auto;padding:8px 12px" onclick="elegirNave(${n.id})">Usar</button>`) : `<button class="action" style="width:auto;padding:8px 12px;background:#ffb700" onclick="comprarNave(${n.id})">💰 ${n.price}</button>`}</div>
    </div>`;
  });
  document.getElementById('ships').innerHTML=html;
}
window.comprarNave=(id)=>{ let n=NAVES[id]; if(coins>=n.price){ coins-=n.price; owned.push(id); naveActual=id; save(); renderShop(); } else alert('Te faltan monedas. Ve un anuncio para +50'); };
window.elegirNave=(id)=>{ naveActual=id; save(); renderShop(); };

document.getElementById('left').ontouchstart=e=>{ player.x=Math.max(0,player.x-NAVES[naveActual].speed); e.preventDefault(); };
document.getElementById('right').ontouchstart=e=>{ player.x=Math.min(310,player.x+NAVES[naveActual].speed); e.preventDefault(); };
document.getElementById('fire').ontouchstart=e=>{ shoot(); e.preventDefault(); };
document.getElementById('left').onmousedown=()=>player.x=Math.max(0,player.x-NAVES[naveActual].speed);
document.getElementById('right').onmousedown=()=>player.x=Math.min(310,player.x+NAVES[naveActual].speed);
document.getElementById('fire').onmousedown=shoot;
document.getElementById('shopBtn').onclick=()=>{ renderShop(); document.getElementById('shop').classList.add('show'); };
document.getElementById('btnRevive').onclick=()=>{ if(typeof show_12010449==='function'){ show_12010449().then(()=>{ player.vida=2; document.getElementById('vidaP').innerText=2; document.getElementById('gameover').classList.remove('show'); running=true; loop(); }); } };

crearEnemigo(); updateUI(); loop();
</script>
</body>
</html>
