<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RULETA</title>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
body{margin:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Arial}
#ruletaWrap{position:relative;width:300px;height:300px}
#canvasRuleta{width:300px;height:300px;border-radius:50%;background:#111;box-shadow:0 0 0 6px #222, 0 0 0 10px #FFD700;transition:transform 4s cubic-bezier(0.15,0,0.85,1);}
#flecha{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid #fff;z-index:20}
#centro{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:#000;border:3px solid #FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:900;font-size:12px;z-index:10}
#btnGirar{margin-top:30px;background:linear-gradient(90deg,#FFD700,#FFA000);color:#000;border:0;padding:16px 30px;border-radius:30px;font-weight:900;font-size:18px;cursor:pointer;width:90%;max-width:340px}
</style>
</head>
<body>

<div id="ruletaWrap">
  <div id="flecha"></div>
  <canvas id="canvasRuleta" width="300" height="300"></canvas>
  <div id="centro">GIRAR</div>
</div>

<button id="btnGirar">📺 VER ANUNCIO PARA GIRAR</button>

<script>
function safeShow(){return new Promise(r=>{try{if(typeof show_12010449!=='undefined'){show_12010449().then(()=>r()).catch(()=>r());}else{r();}}catch(e){r();}});}

let canvas=document.getElementById('canvasRuleta');
let ctx=canvas.getContext('2d');
let girando=false;
let anguloActual=0;
let segmentos=12;
let colores=["#FFD700","#2AABEE","#FF6D00","#2AABEE","#9C27B0","#2AABEE","#00C853","#2AABEE","#E50914","#2AABEE","#FF6D00","#2AABEE"];

function dibujarRuleta(){
  ctx.clearRect(0,0,300,300);
  let ang=2*Math.PI/segmentos;
  for(let i=0;i<segmentos;i++){
    ctx.beginPath(); ctx.moveTo(150,150); ctx.arc(150,150,145,i*ang,(i+1)*ang); ctx.closePath();
    ctx.fillStyle=colores[i]; ctx.fill();
    ctx.strokeStyle="#111"; ctx.lineWidth=2; ctx.stroke();
  }
}
dibujarRuleta();

function hacerGiro(){
  let gradosPorSegmento = 360/segmentos;
  let ganadorIndex = Math.floor(Math.random()*segmentos);
  let vueltas = 1800 + Math.random()*1000;
  let destino = 360 - (ganadorIndex*gradosPorSegmento + gradosPorSegmento/2);
  anguloActual = anguloActual + vueltas + destino - (anguloActual % 360);
  canvas.style.transform = `rotate(${anguloActual}deg)`;
}

document.getElementById('btnGirar').onclick = async () => {
  if(girando) return;
  girando=true;
  let btn=document.getElementById('btnGirar');
  btn.innerText="📺 CARGANDO ANUNCIO...";
  await safeShow();
  btn.innerText="🎰 GIRANDO...";
  hacerGiro();
  setTimeout(()=>{
    girando=false;
    btn.innerText="📺 VER ANUNCIO PARA GIRAR";
  }, 4100);
};
</script>
</body>
</html>
