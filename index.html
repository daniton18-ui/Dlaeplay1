<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DALEPLAY SHOOTER - DOBLE ANUNCIO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="3528410"></script>
<style>
body{margin:0;background:#0f1419;color:#fff;font-family:Arial;text-align:center;overflow:hidden}
.header{background:#2AABEE;padding:12px;font-weight:900;font-size:18px}
#hud{display:flex;justify-content:space-between;background:#fff;color:#2AABEE;padding:8px 12px;font-weight:900;border:2px solid #2AABEE;margin:8px;border-radius:10px}
canvas{border:3px solid #2AABEE;background:#000;border-radius:12px;box-shadow:0 0 20px #2AABEE60}
.controls{display:flex;gap:10px;justify-content:center;margin-top:10px}
.controls button{width:80px;height:65px;background:#fff;border:2px solid #2AABEE;color:#2AABEE;font-size:28px;border-radius:15px;font-weight:900}
.controls button:active{background:#2AABEE;color:#fff}
#status{color:#0f0;font-size:11px;margin-top:6px}
</style>
</head>
<body>
<div class="header">🍟 DALEPLAY SHOOTER - NIVEL INFIERNO</div>
<div id="hud"><span id="score">SCORE 0</span><span id="lvl">LVL 1</span><span id="money">ADS $0.00</span></div>
<canvas id="game" width="360" height="500"></canvas>
<div id="status">ID 12010449 + 3528410 ACTIVOS</div>
<div class="controls">
<button id="left">◀</button>
<button id="fire">🔥</button>
<button id="right">▶</button>
</div>

<script>
let tg=Telegram.WebApp; tg.ready(); tg.expand();

let score=0, level=1, ads=0, isAd=false;
let player={x:170,y:460,speed:5}, bullets=[], enemies=[], eBullets=[], keys={};
const c=document.getElementById('game'), ctx=c.getContext('2d');

// FIX ANTI-CONGELAMIENTO
function show_12010449_safe(){
  return new Promise(r=>{
    let ok=false; let f=()=>{if(!ok){ok=true;r();}};
    setTimeout(f, 3000);
    try{ show_12010449().then(f).catch(f); }catch(e){ f(); }
  });
}
function show_3528410_safe(){
  return new Promise(r=>{
    setTimeout(r, 2500);
    try{ tg.openLink('https://alwingulla.com/g/3528410'); }catch(e){}
  });
}

function spawn(lv){
  enemies=[];
  let rows=4+lv, cols=9;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) enemies.push({x:12+c*37,y:40+r*26,w:24,h:14,dir:1,alive:true});
}
spawn(1);

function shoot(){ if(isAd) return; bullets.push({x:player.x+10,y:player.y,vy:-9}); }

async function reviveAd(){
  if(isAd) return; isAd=true;
  document.getElementById('status').innerText='▶ MOSTRANDO ANUNCIO 12010449 PARA REVIVIR...';
  await show_12010449_safe();
  ads++; document.getElementById('money').innerText=`ADS $${(ads*0.04).toFixed(2)}`;
  document.getElementById('status').innerText='✅ REVIVISTE - ID 12010449 PAGADO';
  player.x=170; bullets=[]; eBullets=[]; isAd=false;
}

async function nextLevelAd(){
  if(isAd) return; isAd=true;
  document.getElementById('status').innerText='▶ MOSTRANDO ANUNCIO 3528410 PARA PASAR DE NIVEL...';
  await show_3528410_safe();
  ads++; level++; score+=1000;
  document.getElementById('lvl').innerText='LVL '+level;
  document.getElementById('score').innerText='SCORE '+score;
  document.getElementById('money').innerText=`ADS $${(ads*0.04).toFixed(2)}`;
  document.getElementById('status').innerText=`✅ NIVEL ${level} - ID 3528410 PAGADO`;
  player.x=170; bullets=[]; eBullets=[]; spawn(level); isAd=false;
}

function die(){
  if(isAd) return; isAd=true;
  tg.HapticFeedback.notificationOccurred('error');
  tg.showPopup({
    title:`💀 MORISTE NIVEL ${level}`,
    message:`Score: ${score}\nMira anuncio 12010449 para revivir`,
    buttons:[{id:'revive',type:'default',text:'💰 VER ANUNCIO 12010449 REVIVIR'}]
  });
}

function win(){
  if(isAd) return; isAd=true;
  tg.HapticFeedback.notificationOccurred('success');
  tg.showPopup({
    title:`🎉 NIVEL ${level} PASADO`,
    message:`Mataste a todos! Score ${score}\nMira anuncio 3528410 para nivel ${level+1}`,
    buttons:[{id:'next',type:'default',text:'💰 VER ANUNCIO 3528410 PASAR NIVEL'}]
  });
}

tg.onPopupButtonClicked = (d)=>{
  if(d.buttonId==='revive') reviveAd();
  if(d.buttonId==='next') nextLevelAd();
};

function update(){
  if(isAd) return;
  if(keys['left']) player.x-=player.speed;
  if(keys['right']) player.x+=player.speed;
  player.x=Math.max(0,Math.min(336,player.x));
  bullets.forEach((b,i)=>{b.y+=b.vy; if(b.y<0) bullets.splice(i,1);});
  let edge=false, spd=0.8+level*0.6;
  enemies.forEach(e=>{if(!e.alive)return; e.x+=e.dir*spd; if(e.x<2||e.x>334) edge=true;});
  if(edge) enemies.forEach(e=>{e.dir*=-1; e.y+=15+level;});
  eBullets.forEach((b,i)=>{
    b.y+=b.vy; if(b.y>500) eBullets.splice(i,1);
    if(b.x>player.x&&b.x<player.x+24&&b.y>player.y&&b.y<player.y+15){eBullets.splice(i,1); die();}
  });
  bullets.forEach((b,bi)=>{
    enemies.forEach(e=>{
      if(!e.alive) return;
      if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
        e.alive=false; bullets.splice(bi,1); score+=100;
        document.getElementById('score').innerText='SCORE '+score;
      }
    });
  });
  if(enemies.every(e=>!e.alive)) win();
  if(enemies.some(e=>e.alive&&e.y>440)) die();
}

function draw(){
  ctx.clearRect(0,0,360,500);
  ctx.fillStyle='#0ff'; ctx.fillRect(player.x,player.y,24,5); ctx.fillRect(player.x+8,player.y-10,8,12);
  ctx.fillStyle='#ff0'; bullets.forEach(b=>ctx.fillRect(b.x,b.y,3,12));
  ctx.fillStyle='#f00'; eBullets.forEach(b=>ctx.fillRect(b.x,b.y,3,10));
  enemies.forEach(e=>{
    if(!e.alive) return;
    ctx.fillStyle='#f00'; ctx.fillRect(e.x,e.y,24,10);
    ctx.fillRect(e.x+3,e.y+10,5,4); ctx.fillRect(e.x+16,e.y+10,5,4);
  });
}

function loop(){ update(); draw(); requestAnimationFrame(loop); } loop();

document.getElementById('left').ontouchstart=e=>{e.preventDefault();keys['left']=true;};
document.getElementById('left').ontouchend=e=>{e.preventDefault();keys['left']=false;};
document.getElementById('right').ontouchstart=e=>{e.preventDefault();keys['right']=true;};
document.getElementById('right').ontouchend=e=>{e.preventDefault();keys['right']=false;};
document.getElementById('fire').ontouchstart=e=>{e.preventDefault();shoot();};

setInterval(()=>{
  if(isAd) return;
  let alive=enemies.filter(e=>e.alive); if(!alive.length) return;
  let e=alive[Math.floor(Math.random()*alive.length)];
  eBullets.push({x:e.x+10,y:e.y+12,vy:3+level*0.5});
}, 500);
</script>
</body>
</html>
