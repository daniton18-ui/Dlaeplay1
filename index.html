<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DALEPLAY SHOOTER - PAGA 100%</title>
<style>
body{margin:0;background:#0f1419;color:#fff;font-family:Arial;text-align:center;overflow:hidden}
.header{background:#2AABEE;padding:12px;font-weight:900;font-size:18px}
#hud{display:flex;justify-content:space-between;background:#fff;color:#2AABEE;padding:10px 12px;font-weight:900;border:2px solid #2AABEE;margin:8px;border-radius:12px;font-size:13px}
canvas{border:3px solid #2AABEE;background:#000;border-radius:12px;display:block;margin:0 auto}
.controls{display:flex;gap:12px;justify-content:center;margin-top:12px}
.controls button{width:85px;height:70px;background:#fff;border:2px solid #2AABEE;color:#2AABEE;font-size:30px;border-radius:16px;font-weight:900}
.controls button:active{background:#2AABEE;color:#fff;transform:scale(0.95)}
#status{color:#0f0;font-size:11px;margin-top:6px;height:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:99999}
.modal .box{background:#fff;color:#000;padding:22px;border-radius:18px;border:3px solid #2AABEE;width:85%;max-width:320px;text-align:center}
.modal .box h2{color:#2AABEE;margin:0 0 8px 0;font-size:22px}
.modal .box p{font-size:14px;margin:8px 0}
.modal .box button{background:#2AABEE;color:#fff;border:0;padding:16px;width:100%;border-radius:12px;font-weight:900;margin-top:12px;font-size:16px;cursor:pointer;box-shadow:0 4px 12px rgba(42,171,238,0.4)}
.modal .box button:active{transform:scale(0.97)}
</style>
<!-- TUS 2 ZONAS QUE PAGAN -->
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
</head>
<body>
<div class="header">🍟 DALEPLAY SHOOTER - NIVEL INFIERNO</div>
<div id="hud"><span id="s">SCORE 0</span><span id="l">LVL 1</span><span id="m">ADS $0.00</span></div>
<canvas id="g" width="360" height="500"></canvas>
<div id="status">12010449 + 3528410 ACTIVOS - PAGA POR CLICK</div>
<div class="controls"><button id="L">◀</button><button id="F">🔥</button><button id="R">▶</button></div>

<!-- MODAL MUERTE - ANUNCIO 12010449 PARA REVIVIR -->
<div id="md" class="modal"><div class="box"><h2>💀 MORISTE</h2><p id="dt">Nivel 1</p><p style="color:#2AABEE;font-weight:900">¡Mira 1 anuncio para revivir!</p><button id="br">💰 VER ANUNCIO PARA REVIVIR<br><small>12010449 - PAGA $0.04</small></button></div></div>

<!-- MODAL NIVEL - ANUNCIO 3528410 PARA PASAR -->
<div id="mw" class="modal"><div class="box"><h2>🎉 NIVEL PASADO!</h2><p id="wt"></p><p style="color:#2AABEE;font-weight:900">¡Mira 1 anuncio para pasar!</p><button id="bn">💰 VER ANUNCIO PASAR NIVEL<br><small>3528410 - PAGA $0.05</small></button></div></div>

<script>
let score=0,level=1,ads=0,paused=false;
let pl={x:170,y:460,s:5},bull=[],en=[],eb=[],keys={};
const cn=document.getElementById('g'),cx=cn.getContext('2d');

function spawn(lv){
  en=[];
  let rows=4+Math.min(lv,5), cols=9;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) en.push({x:12+c*37,y:40+r*26,w:24,h:12,dir:1,a:true});
}
spawn(1);

// FUNCIONES QUE SI PAGAN - SE LLAMAN CON CLICK HUMANO
function pagar12010449(){
  try{ if(typeof show_12010449!=='undefined'){ show_12010449(); } }catch(e){}
  try{ window.open('https://alwingulla.com/4/3528410','_blank'); }catch(e){}
  try{ 
    let s=document.createElement('script'); s.src='https://alwingulla.com/88/tag.min.js'; s.setAttribute('data-zone','3528410'); document.body.appendChild(s);
  }catch(e){}
}
function pagar3528410(){
  try{ if(typeof show_12010449!=='undefined'){ show_12010449(); } }catch(e){}
  try{ window.open('https://alwingulla.com/4/3528410','_blank'); }catch(e){}
  try{ 
    let s=document.createElement('script'); s.src='https://alwingulla.com/88/tag.min.js'; s.setAttribute('data-zone','3528410'); document.body.appendChild(s);
  }catch(e){}
}

function morir(){
  if(paused) return;
  paused=true;
  document.getElementById('dt').innerText=`Moriste Nivel ${level} | Score ${score}`;
  document.getElementById('md').style.display='flex';
}
function ganar(){
  if(paused) return;
  paused=true;
  document.getElementById('wt').innerText=`Nivel ${level} pasado! Score ${score}`;
  document.getElementById('mw').style.display='flex';
}

// REVIVIR - PAGA Y REVIVE INSTANTANEO (NO SE QUEDA)
document.getElementById('br').onclick=()=>{
  pagar12010449();
  ads++; document.getElementById('m').innerText='ADS $'+(ads*0.04).toFixed(2);
  document.getElementById('md').style.display='none';
  pl.x=170; bull=[]; eb=[]; paused=false;
  document.getElementById('status').innerText='✅ REVIVISTE - 12010449 PAGADO $0.04';
};

// PASAR NIVEL - PAGA Y PASA INSTANTANEO
document.getElementById('bn').onclick=()=>{
  pagar3528410();
  ads++; level++; score+=1000;
  document.getElementById('l').innerText='LVL '+level;
  document.getElementById('s').innerText='SCORE '+score;
  document.getElementById('m').innerText='ADS $'+(ads*0.05).toFixed(2);
  document.getElementById('mw').style.display='none';
  pl.x=170; bull=[]; eb=[]; spawn(level); paused=false;
  document.getElementById('status').innerText=`✅ NIVEL ${level} - 3528410 PAGADO $0.05`;
};

function update(){
  if(paused) return;
  if(keys.L) pl.x-=pl.s;
  if(keys.R) pl.x+=pl.s;
  pl.x=Math.max(0,Math.min(336,pl.x));
  bull.forEach((b,i)=>{b.y+=b.vy; if(b.y<0) bull.splice(i,1);});
  let edge=false, sp=0.9+level*0.55;
  en.forEach(e=>{if(!e.a)return; e.x+=e.dir*sp; if(e.x<2||e.x>334) edge=true;});
  if(edge) en.forEach(e=>{e.dir*=-1; e.y+=16;});
  eb.forEach((b,i)=>{
    b.y+=b.vy; if(b.y>520) eb.splice(i,1);
    if(b.x>pl.x&&b.x<pl.x+24&&b.y>pl.y&&b.y<pl.y+15){ eb.splice(i,1); morir(); }
  });
  bull.forEach((b,bi)=>{
    en.forEach(e=>{
      if(!e.a) return;
      if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){ e.a=false; bull.splice(bi,1); score+=100; document.getElementById('s').innerText='SCORE '+score; }
    });
  });
  if(en.every(e=>!e.a)) ganar();
  if(en.some(e=>e.a&&e.y>440)) morir();
}
function draw(){
  cx.clearRect(0,0,360,500);
  cx.fillStyle='#0ff'; cx.fillRect(pl.x,pl.y,24,5); cx.fillRect(pl.x+8,pl.y-10,8,12);
  cx.fillStyle='#ff0'; bull.forEach(b=>cx.fillRect(b.x,b.y,3,12));
  cx.fillStyle='#f00'; eb.forEach(b=>cx.fillRect(b.x,b.y,3,10));
  en.forEach(e=>{if(!e.a)return; cx.fillStyle='#f00'; cx.fillRect(e.x,e.y,24,10);});
}
function loop(){ update(); draw(); requestAnimationFrame(loop); } loop();

document.getElementById('L').ontouchstart=e=>{e.preventDefault();keys.L=true;};
document.getElementById('L').ontouchend=e=>{e.preventDefault();keys.L=false;};
document.getElementById('R').ontouchstart=e=>{e.preventDefault();keys.R=true;};
document.getElementById('R').ontouchend=e=>{e.preventDefault();keys.R=false;};
document.getElementById('F').ontouchstart=e=>{e.preventDefault(); if(!paused) bull.push({x:pl.x+10,y:pl.y,vy:-10}); };
setInterval(()=>{ if(paused) return; let a=en.filter(e=>e.a); if(!a.length) return; let e=a[Math.floor(Math.random()*a.length)]; eb.push({x:e.x+10,y:e.y+12,vy:3+level*0.4}); }, 650);
</script>
</body>
</html>
