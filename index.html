<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DALEPLAY1</title>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
body{margin:0;background:#071a0a;font-family:Arial;text-align:center;color:#fff}
.header{background:#7fff00;color:#000;padding:14px;font-weight:900;font-size:20px}
.cont{color:#7fff00;border:2px solid #7fff00;border-radius:12px;margin:12px;padding:10px;font-weight:bold}
.grid{width:95%;max-width:360px;margin:10px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.box{height:60px;background:#152e18;border:2px solid #7fff00;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;font-weight:900}
.btn{margin:8px auto;border:0;padding:14px;width:90%;max-width:360px;border-radius:12px;font-weight:900;display:block;cursor:pointer}
#btnCompartir{background:#25D366;color:#000}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:99}
.caja{background:#112d18;border:3px solid #7fff00;padding:22px;border-radius:18px;margin:20px}
</style>
</head>
<body>
<div class="header">GANA CON DALEPLAY1</div>
<div class="cont" id="ci">Intentos: 2</div>
<div class="grid" id="g"></div>
<button id="btnCompartir" class="btn" onclick="compartir()">📤 COMPARTE 0/3 PARA 2 INTENTOS</button>
<div id="modal"><div class="caja"><h1 style="color:#7fff00">GANASTE</h1><p>Código: <b id="cod"></b></p><button onclick="this.parentElement.parentElement.style.display='none'" style="background:#7fff00;padding:14px;width:100%;border-radius:10px;font-weight:900">RECLAMAR</button></div></div>
<script>
show_12010449({type:'inApp',inAppSettings:{frequency:2,capping:0.1,interval:30,timeout:5,everyPage:false}});
let intentos=2,ganadora=Math.floor(Math.random()*25),compartidos=parseInt(localStorage.getItem('daleplay_compartidos')||'0');
let g=document.getElementById('g');
function crear(){
  g.innerHTML=''; ganadora=Math.floor(Math.random()*25);
  for(let i=0;i<25;i++){let d=document.createElement('div');d.className='box';d.innerText='?';d.onclick=()=>jugar(i,d);g.appendChild(d);}
  document.getElementById('ci').innerText='Intentos: '+intentos;
  document.getElementById('btnCompartir').innerText='📤 COMPARTE '+compartidos+'/3 PARA 2 INTENTOS';
}
function jugar(i,d){
  if(intentos<=0)return;intentos--;document.getElementById('ci').innerText='Intentos: '+intentos;show_12010449();
  if(i===ganadora){d.innerText='💎';document.getElementById('cod').innerText='DP-'+Math.floor(Math.random()*90000+10000);document.getElementById('modal').style.display='flex';}else{d.innerText='💣';}
}
function compartir(){
  window.open('https://wa.me/?text='+encodeURIComponent('🔥 Estoy ganando en DALEPLAY1 https://t.me/Daleplay1bot/daleplay1'),'_blank');
  compartidos++;localStorage.setItem('daleplay_compartidos',compartidos);
  if(compartidos<3){document.getElementById('btnCompartir').innerText='📤 COMPARTE '+compartidos+'/3 PARA 2 INTENTOS';show_12010449();}
  else{intentos+=2;document.getElementById('btnCompartir').innerText='✅ GANASTE 2 INTENTOS!';show_12010449('pop');setTimeout(()=>{document.getElementById('btnCompartir').style.display='none';localStorage.setItem('daleplay_compartidos','0');},2000);document.getElementById('ci').innerText='Intentos: '+intentos;}
}
crear();
</script>
</body>
</html>
