<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DALEPLAY1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
body{margin:0;background:#071a0a;font-family:Arial;text-align:center;color:#fff}
.header{background:#7fff00;color:#000;padding:14px;font-weight:900;font-size:20px}
.cont{color:#7fff00;border:2px solid #7fff00;border-radius:12px;margin:10px;padding:10px;font-weight:bold}
#stats{background:#111;border:1px solid #333;border-radius:10px;margin:0 12px;padding:8px;font-size:12px;color:#7fff00}
#timer{color:#fff;background:#152e18;border:1px dashed #7fff00;border-radius:10px;margin:8px 12px;padding:8px;font-size:14px}
.grid{width:95%;max-width:360px;margin:10px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.box{height:60px;background:#152e18;border:2px solid #7fff00;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;font-weight:900}
.box.abierto{background:#222;color:#888;border-color:#555}
.btn{margin:8px auto;border:0;padding:14px;width:90%;max-width:360px;border-radius:12px;font-weight:900;display:block;cursor:pointer}
#btnCompartir{background:#25D366;color:#000}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:99}
.caja{background:#112d18;border:3px solid #7fff00;padding:22px;border-radius:18px;margin:20px}
</style>
</head>
<body>
<div class="header">GANA CON DALEPLAY1 - 🍟 SALCHIPAPA</div>

<div id="stats">👀 Cargando vistas... | 🏆 Verificando ganador...</div>
<div class="cont" id="ci">Intentos: 2</div>
<div id="userInfo" style="font-size:12px;color:#7fff00;margin:4px"></div>
<div id="timer">⏳ Reinicio en: 60:00</div>
<div class="grid" id="g"></div>
<button id="btnCompartir" class="btn">📤 COMPARTE 0/3 PARA 2 INTENTOS</button>

<div id="modal"><div class="caja"><h1 style="color:#7fff00">¡GANASTE LA SALCHIPAPA! 🍟</h1><p>Eres el UNICO ganador de hoy</p><p>Código: <b id="cod"></b></p><p style="font-size:12px" id="idTxt"></p><button onclick="location.reload()" style="background:#7fff00;padding:14px;width:100%;border-radius:10px;font-weight:900">RECLAMAR</button></div></div>

<script>
let tg = window.Telegram ? window.Telegram.WebApp : null;
let USER_ID = 'anon';
let USER_NAME = 'Jugador';
if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
  USER_ID = tg.initDataUnsafe.user.id.toString();
  USER_NAME = tg.initDataUnsafe.user.first_name || tg.initDataUnsafe.user.username || 'Jugador';
  try{ tg.expand(); tg.ready(); }catch(e){}
}
document.getElementById('userInfo').innerText = '👤 ' + USER_NAME + ' | ID:' + USER_ID;

function k(name){ return 'dale_' + USER_ID + '_' + name; }
function safeShow(t){ try{ if(typeof show_12010449!=='undefined') show_12010449(t); }catch(e){} }

// === NUEVO: CONTADOR GLOBAL Y GANADOR UNICO ===
let hoyKey = new Date().toLocaleDateString('es-CO',{timeZone:'America/Bogota'}).replace(/\//g,'-');
let statsEl = document.getElementById('stats');
let hayGanadorGlobal = false;

async function initGlobal(){
  try{
    // 1. Contar vistas globales
    let r1 = await fetch(`https://api.countapi.xyz/hit/daleplay1-barranquilla/views-total`);
    let d1 = await r1.json();
    let vistas = d1.value;

    // 2. Verificar si ya hay ganador hoy (global)
    let r2 = await fetch(`https://api.countapi.xyz/get/daleplay1-barranquilla/winner-${hoyKey}`);
    let d2 = await r2.json();
    hayGanadorGlobal = d2.value && d2.value > 0;

    if(hayGanadorGlobal){
      statsEl.innerHTML = `👀 ${vistas} jugando hoy | 🏆 ¡YA HAY GANADOR HOY! Vuelve mañana`;
      statsEl.style.background = "#331111";
      statsEl.style.color = "#ff7777";
    } else {
      statsEl.innerHTML = `👀 ${vistas} personas jugando hoy | 🏆 Aún nadie gana la salchipapa`;
    }

    // 3. LOG: Guardar ID en consola (luego lo pasamos a Google Sheet)
    console.log("LOG_JUGADOR:", JSON.stringify({id: USER_ID, name: USER_NAME, fecha: new Date().toISOString(), hoy: hoyKey}));
    
  } catch(e){
    statsEl.innerHTML = `👀 100+ jugando | 🏆 1 salchipapa diaria`;
  }
}
initGlobal();

// TIMER
let UNA_HORA = 60*60*1000;
let timerEl = document.getElementById('timer');
let horaGuardada = parseInt(localStorage.getItem(k('hora'))||'0');
if(!horaGuardada){ horaGuardada=Date.now(); localStorage.setItem(k('hora'),horaGuardada); }
setInterval(()=>{
  let diff = (horaGuardada + UNA_HORA) - Date.now();
  if(diff<=0){
    localStorage.setItem(k('intentos'), '2');
    localStorage.setItem(k('descubiertas'), '[]');
    localStorage.removeItem(k('ganadora'));
    localStorage.setItem(k('compartidos'), '0');
    localStorage.setItem(k('recompensa_compartir'), '0');
    localStorage.setItem(k('hora'), Date.now().toString());
    timerEl.innerText="✅ ¡Nuevos intentos!";
    location.reload();
    return;
  }
  let m=Math.floor(diff/60000);
  let s=Math.floor((diff%60000)/1000);
  timerEl.innerText=`⏳ Reinicio en: ${m}:${s.toString().padStart(2,'0')}`;
},1000);

// JUEGO
let g=document.getElementById('g');
let ci=document.getElementById('ci');
let btnCompartir=document.getElementById('btnCompartir');
let intentosRaw = localStorage.getItem(k('intentos'));
let intentos = (intentosRaw===null) ? 2 : parseInt(intentosRaw);
if(isNaN(intentos)) intentos=2;
let compartidos = parseInt(localStorage.getItem(k('compartidos'))||'0');
let recompensaYaDada = parseInt(localStorage.getItem(k('recompensa_compartir'))||'0');
let ganadoraRaw = localStorage.getItem(k('ganadora'));
let ganadora = ganadoraRaw===null ? null : parseInt(ganadoraRaw);
if(ganadora===null || isNaN(ganadora)){ ganadora=Math.floor(Math.random()*25); localStorage.setItem(k('ganadora'),ganadora.toString()); }
let descubiertas = JSON.parse(localStorage.getItem(k('descubiertas'))||'[]');

function crear(){
  g.innerHTML='';
  for(let i=0;i<25;i++){
    let d=document.createElement('div'); d.className='box';
    if(descubiertas.includes(i)){ d.innerText=(i===ganadora?'💎':'💣'); d.classList.add('abierto'); }
    else { d.innerText='?'; d.onclick=()=>jugar(i,d); }
    g.appendChild(d);
  }
  ci.innerText='Intentos: '+intentos;
  if(recompensaYaDada===1){
    btnCompartir.innerText='✅ YA RECLAMASTE +2 HOY';
    btnCompartir.style.opacity='0.6';
    btnCompartir.disabled=true;
  } else {
    btnCompartir.innerText='📤 COMPARTE '+compartidos+'/3 PARA 2 INTENTOS';
  }
}

async function jugar(i,d){
  if(intentos<=0 || descubiertas.includes(i)) return;

  // BLOQUEO GLOBAL: Si ya hay ganador hoy, no dejar ganar
  if(hayGanadorGlobal){
    alert('¡YA HAY GANADOR HOY! 🍟\n\nHoy ya se ganó la salchipapa. Vuelve mañana a las 12am y sé el primero. Así no me quiebro 😅');
    return;
  }

  intentos--; descubiertas.push(i);
  localStorage.setItem(k('intentos'),intentos.toString());
  localStorage.setItem(k('descubiertas'),JSON.stringify(descubiertas));
  safeShow();

  if(i===ganadora){
    // DOBLE CHEQUEO GLOBAL ANTES DE PREMIAR
    try{
      let check = await fetch(`https://api.countapi.xyz/get/daleplay1-barranquilla/winner-${hoyKey}`);
      let checkData = await check.json();
      if(checkData.value && checkData.value > 0){
        alert('¡Uy! Alguien te ganó por segundos. Ya hay ganador hoy.');
        location.reload();
        return;
      }
      // MARCAR GANADOR GLOBAL
      await fetch(`https://api.countapi.xyz/hit/daleplay1-barranquilla/winner-${hoyKey}`);
    }catch(e){}

    d.innerText='💎';
    let codigo = 'DP-'+Math.floor(Math.random()*90000+10000);
    document.getElementById('cod').innerText=codigo;
    document.getElementById('idTxt').innerText='ID: '+USER_ID+' | '+USER_NAME;
    document.getElementById('modal').style.display='flex';
    
    // Guardar ganador local y global
    localStorage.setItem(k('hora'),Date.now().toString());
    localStorage.removeItem(k('ganadora')); 
    localStorage.removeItem(k('descubiertas'));
    localStorage.setItem(k('intentos'),'2');
    
    // Enviar datos a Telegram bot (si está dentro de Telegram)
    try{ tg.sendData(`GANADOR_SALCHIPAPA|ID:${USER_ID}|NAME:${USER_NAME}|COD:${codigo}`); }catch(e){}
    
  }else{ d.innerText='💣'; d.classList.add('abierto'); }
  ci.innerText='Intentos: '+intentos;
}

btnCompartir.onclick=()=>{
  if(recompensaYaDada===1) return;
  window.open('https://wa.me/?text='+encodeURIComponent('🔥 Estoy ganando una SALCHIPAPA en DALEPLAY1 https://t.me/Daleplay1bot/daleplay1'),'_blank');
  compartidos++;
  localStorage.setItem(k('compartidos'),compartidos.toString());
  if(compartidos>=3 && recompensaYaDada===0){
    intentos+=2;
    recompensaYaDada=1;
    localStorage.setItem(k('intentos'),intentos.toString());
    localStorage.setItem(k('recompensa_compartir'),'1');
    ci.innerText='Intentos: '+intentos;
    btnCompartir.innerText='✅ YA RECLAMASTE +2 HOY';
    btnCompartir.disabled=true;
    btnCompartir.style.opacity='0.6';
    safeShow('pop');
  } else {
    btnCompartir.innerText='📤 COMPARTE '+compartidos+'/3 PARA 2 INTENTOS';
  }
  safeShow();
}
try{ safeShow({type:'inApp',inAppSettings:{frequency:2,capping:0.1,interval:30,timeout:5,everyPage:false}}); }catch(e){}
crear();
</script>
</body>
</html>
