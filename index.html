<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ATARI 40 DISTINTOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<script src="//libtl.com/sdk.js" data-zone="12010451" data-sdk="show_12010451"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#000;color:#0f0;font-family:'Press Start 2P',monospace}
 #menu{padding:8px} #grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;max-width:560px;margin:0 auto}
 .card{background:#111;border:2px solid #222;padding:6px;text-align:center}
 .card b{font-size:6px;display:block;line-height:8px;margin-top:4px}
 canvas{display:none;margin:5px auto;border:4px solid #222;background:#000}
 #top{display:none;justify-content:space-between;padding:6px;background:#111;font-size:7px;margin:5px}
 #controls{display:none;justify-content:center;gap:6px}
 .ctrl{width:68px;height:68px;background:#222;border:3px solid #444;color:#0f0;font-family:'Press Start 2P';font-size:9px}
 #over{position:fixed;inset:0;background:#000;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:99;border:5px solid #0f0}
 #over.show{display:flex}
 button.action{padding:10px;width:90%;max-width:320px;background:#0f0;color:#000;font-family:'Press Start 2P';font-size:8px;margin:6px;border:0}
</style>
</head>
<body>
<div id="menu">
  <h2 style="text-align:center;font-size:10px;color:#ff0">ATARI 40 - TODOS DISTINTOS</h2>
  <p style="text-align:center;font-size:6px;color:#555">COINS: <span id="cM">0</span> - CADA JUEGO SE VE DIFERENTE</p>
  <div id="grid"></div>
</div>
<div id="top"><span id="t1"></span><span id="t2"></span><button onclick="goMenu()" style="background:#222;border:2px solid #0f0;color:#0f0;font-family:'Press Start 2P';font-size:6px">MENU</button></div>
<canvas id="game" width="320" height="400"></canvas>
<div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="fire">FIRE</button><button class="ctrl" id="right">▶</button></div>
<div id="over"><h2 id="oT" style="font-size:10px"></h2><p id="oM" style="font-size:7px"></p><button class="action" id="btnR">REVIVIR AD 12010449</button><button class="action" style="background:#222;color:#0f0;border:2px solid #0f0" onclick="goMenu()">MENU 40</button></div>
<script>
const tg=Telegram.WebApp; tg.ready(); tg.expand();
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let coins=parseInt(localStorage.getItem('coins')||0), mode=null, running=false, score=0, nivel=1, player={}, bullets=[], enemies=[], ball={};

const G=[
 {id:1,n:"BREAKOUT",i:"🧱",t:"breakout"}, {id:2,n:"PONG",i:"🏓",t:"pong"}, {id:3,n:"INVADERS",i:"👾",t:"invaders"}, {id:4,n:"ASTEROIDS",i:"☄️",t:"asteroids"},
 {id:5,n:"MISSILE CMD",i:"🚀",t:"missile"}, {id:6,n:"PAC-MAN",i:"🟡",t:"pacman"}, {id:7,n:"FROGGER",i:"🐸",t:"frogger"}, {id:8,n:"RIVER RAID",i:"✈️",t:"river"},
 {id:9,n:"COMBAT",i:"🪖",t:"tanks"}, {id:10,n:"SEAQUEST",i:"🦈",t:"seaquest"}, {id:11,n:"CENTIPEDE",i:"🐛",t:"centipede"}, {id:12,n:"ENDURO",i:"🏎️",t:"enduro"},
 {id:13,n:"FREEWAY",i:"🐔",t:"freeway"}, {id:14,n:"KABOOM",i:"💣",t:"kaboom"}, {id:15,n:"PITFALL",i:"🕳️",t:"pitfall"}, {id:16,n:"LASER BLAST",i:"🔫",t:"laser"},
 {id:17,n:"DEMON ATK",i:"👹",t:"demon"}, {id:18,n:"BARNSTORM",i:"🛩️",t:"barn"}, {id:19,n:"BOXING",i:"🥊",t:"boxing"}, {id:20,n:"BOWLING",i:"🎳",t:"bowling"},
 {id:21,n:"SKIING",i:"🎿",t:"skiing"}, {id:22,n:"TENNIS",i:"🎾",t:"tennis"}, {id:23,n:"FISHING",i:"🎣",t:"fishing"}, {id:24,n:"CIRCUS",i:"🤹",t:"circus"},
 {id:25,n:"Q*BERT",i:"🔶",t:"qbert"}, {id:26,n:"DIG DUG",i:"⛏️",t:"digdug"}, {id:27,n:"JUNGLE",i:"🌴",t:"jungle"}, {id:28,n:"MOON PATROL",i:"🌙",t:"moon"},
 {id:29,n:"BURGERTIME",i:"🍔",t:"burger"}, {id:30,n:"JOUST",i:"🦅",t:"joust"}, {id:31,n:"HERO",i:"🦸",t:"hero"}, {id:32,n:"BERZERK",i:"🤖",t:"berzerk"},
 {id:33,n:"YARS",i:"🪰",t:"yars"}, {id:34,n:"GALAGA",i:"👽",t:"galaga"}, {id:35,n:"DEFENDER",i:"🛸",t:"defender"}, {id:36,n:"KEYSTONE",i:"👮",t:"keystone"},
 {id:37,n:"BASKET",i:"🏀",t:"basket"}, {id:38,n:"ICE HOCKEY",i:"🏒",t:"hockey"}, {id:39,n:"DODGE",i:"💀",t:"dodge"}, {id:40,n:"BOSS RUSH",i:"👑",t:"boss"},
];

function render(){ document.getElementById('cM').innerText=coins; let h=''; G.forEach(g=>h+=`<div class="card" onclick="start(${g.id})"><div style="font-size:20px">${g.i}</div><b>${g.n}</b></div>`); document.getElementById('grid').innerHTML=h; }
function goMenu(){ running=false; mode=null; document.getElementById('menu').style.display='block'; document.getElementById('top').style.display='none'; canvas.style.display='none'; document.getElementById('controls').style.display='none'; document.getElementById('over').classList.remove('show'); }

function start(id){
 let g=G.find(x=>x.id===id); mode=g; score=0; nivel=1; bullets=[]; enemies=[]; 
 document.getElementById('menu').style.display='none'; document.getElementById('top').style.display='flex'; canvas.style.display='block'; document.getElementById('controls').style.display='flex';
 document.getElementById('t1').innerText=g.n;
 if(g.t==='breakout'){ player={x:125,w:70}; ball={x:160,y:200,dx:3,dy:-3,r:5}; enemies=[]; for(let r=0;r<5;r++) for(let c=0;c<8;c++) enemies.push({x:c*38+4,y:r*16+30,alive:true,col:['#f00','#fa0','#ff0','#0f0','#0ff'][r]}); }
 else if(g.t==='pong'){ player={y:150,h:50}; ball={x:160,y:200,dx:3,dy:2,r:5}; enemies=[{y:150,h:50}]; }
 else if(g.t==='invaders'||g.t==='galaga'||g.t==='demon'){ player={x:145,y:360,w:24,h:10}; enemies=[]; for(let r=0;r<4;r++) for(let c=0;c<7;c++) enemies.push({x:c*32+30,y:r*22+20,w:20,h:12,alive:true}); }
 else if(g.t==='asteroids'){ player={x:160,y:200,a:0}; enemies=[]; for(let i=0;i<6;i++) enemies.push({x:Math.random()*320,y:Math.random()*120,w:18,dx:(Math.random()-0.5)*2,dy:Math.random()*1.5}); }
 else if(g.t==='missile'){ player={x:160,y:360}; enemies=[]; bullets=[]; // ciudades
   enemies.cities=[{x:30},{x:90},{x:230},{x:290}]; }
 else if(g.t==='pacman'){ player={x:160,y:300}; bullets=[]; for(let i=0;i<50;i++) bullets.push({x:(i%10)*30+16,y:Math.floor(i/10)*28+30,e:false}); enemies=[{x:80,y:60,c:'#f00'},{x:240,y:60,c:'#0ff'}]; }
 else if(g.t==='frogger'||g.t==='freeway'){ player={x:152,y:380,w:16,h:16}; enemies=[]; for(let r=0;r<5;r++) for(let c=0;c<2;c++) enemies.push({x:c*180+Math.random()*80,y:60+r*50,w:60,h:22,dir:r%2?1:-1,sp:1+r*0.4}); }
 else if(g.t==='river'||g.t==='barn'){ player={x:150,y:320,w:18,h:28}; enemies=[]; }
 else if(g.t==='tanks'){ player={x:50,y:200,a:0}; enemies=[{x:250,y:200}]; }
 else if(g.t==='seaquest'||g.t==='fishing'){ player={x:60,y:200,w:30,h:12}; enemies=[]; }
 else if(g.t==='enduro'){ player={x:140,w:40}; enemies=[]; }
 else { player={x:145,y:350,w:20,h:20}; }
 running=true; loop();
}

function tri(x,y,a){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle="#0ff"; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-10,-7); ctx.lineTo(-10,7); ctx.closePath(); ctx.fill(); ctx.restore(); }

function loop(){
 if(!running) return;
 ctx.fillStyle="#000"; ctx.fillRect(0,0,320,400);

 if(mode.t==='breakout'){
  ball.x+=ball.dx; ball.y+=ball.dy; if(ball.x<0||ball.x>315) ball.dx*=-1; if(ball.y<0) ball.dy*=-1;
  if(ball.y>360&&ball.x>player.x&&ball.x<player.x+player.w) ball.dy=-3;
  enemies.forEach(b=>{ if(b.alive&&ball.x>b.x&&ball.x<b.x+36&&ball.y>b.y&&ball.y<b.y+12){ b.alive=false; ball.dy*=-1; score+=10; }});
  if(ball.y>410) return gameOver(); if(enemies.every(b=>!b.alive)) return win();
  ctx.fillStyle="#fff"; ctx.fillRect(player.x,380,player.w,10); ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,6.28); ctx.fill(); enemies.forEach(b=>{ if(b.alive){ ctx.fillStyle=b.col; ctx.fillRect(b.x,b.y,34,10);} });
 }
 else if(mode.t==='pong'){
  ball.x+=ball.dx; ball.y+=ball.dy; if(ball.y<0||ball.y>395) ball.dy*=-1;
  if(ball.x<18&&ball.y>player.y&&ball.y<player.y+player.h) ball.dx=3; if(ball.x>296&&ball.y>enemies[0].y&&ball.y<enemies[0].y+enemies[0].h) ball.dx=-3;
  enemies[0].y+=(ball.y-enemies[0].y)*0.07;
  if(ball.x<0||ball.x>320){ score++; ball={x:160,y:200,dx:3*(Math.random()>0.5?1:-1),dy:2,r:5}; if(score>5) return win(); }
  ctx.fillStyle="#0f0"; ctx.fillRect(10,player.y,6,player.h); ctx.fillRect(304,enemies[0].y,6,enemies[0].h); ctx.fillStyle="#fff"; ctx.fillRect(ball.x,ball.y,6,6);
  ctx.strokeStyle="#333"; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(160,0); ctx.lineTo(160,400); ctx.stroke(); ctx.setLineDash([]);
 }
 else if(mode.t==='invaders'||mode.t==='galaga'||mode.t==='demon'){
  let down=false; enemies.forEach(e=>{ if(!e.alive) return; e.x+=(mode.t==='galaga'?1.5:1)*(nivel*0.2+1); if(e.x<10||e.x>290) down=true; }); if(down) enemies.forEach(e=>{ e.x-=2; e.y+=10; e.x=320-e.x; });
  if(Math.random()<0.04) bullets.push({x:player.x+12,y:player.y,dy:-5,p:true});
  bullets=bullets.filter(b=>{ b.y+=b.dy; return b.y>-10; });
  bullets.forEach((b,i)=>{ enemies.forEach(e=>{ if(e.alive&&b.p&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){ e.alive=false; bullets.splice(i,1); score+=20; }}); });
  if(enemies.every(e=>!e.alive)) return win();
  ctx.fillStyle="#0f0"; ctx.fillRect(player.x,player.y,24,10); ctx.fillRect(player.x+9,player.y-6,6,6); // canon
  enemies.forEach(e=>{ if(e.alive){ ctx.fillStyle=mode.t==='demon'?'#f0f':e.y<60?'#f00':'#0ff'; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.fillRect(e.x+2,e.y+e.h,3,4); ctx.fillRect(e.x+e.w-5,e.y+e.h,3,4);} });
  ctx.fillStyle="#ff0"; bullets.forEach(b=>ctx.fillRect(b.x,b.y,2,7));
 }
 else if(mode.t==='asteroids'){
  if(Math.random()<0.02) bullets.push({x:player.x,y:player.y,dx:Math.cos(player.a)*5,dy:Math.sin(player.a)*5,l:60});
  player.a+=0.04;
  bullets=bullets.filter(b=>{ b.x+=b.dx; b.y+=b.dy; b.l--; return b.l>0; });
  enemies.forEach(a=>{ a.x+=a.dx; a.y+=a.dy; if(a.x<0) a.x=320; if(a.x>320) a.x=0; if(a.y>400) a.y=0;
   bullets.forEach((b,i)=>{ if(Math.hypot(b.x-a.x,b.y-a.y)<18){ enemies.splice(enemies.indexOf(a),1); bullets.splice(i,1); score+=30; if(enemies.length==0) win(); }});
  });
  tri(player.x,player.y,player.a);
  ctx.strokeStyle="#fff"; enemies.forEach(a=>{ ctx.beginPath(); for(let k=0;k<7;k++){ let an=k/7*6.28, r=a.w+Math.sin(k*1.5)*4; if(k==0) ctx.moveTo(a.x+Math.cos(an)*r,a.y+Math.sin(an)*r); else ctx.lineTo(a.x+Math.cos(an)*r,a.y+Math.sin(an)*r);} ctx.closePath(); ctx.stroke(); });
  ctx.fillStyle="#ff0"; bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,2,0,6.28); ctx.fill(); });
 }
 else if(mode.t==='missile'){
  if(Math.random()<0.03) enemies.push({x:Math.random()*300,y:0,tx:enemies.cities[Math.floor(Math.random()*4)].x+10,ty:360,w:3,dy:1.5});
  enemies.forEach((m,i)=>{ if(m.tx===undefined) return; let dx=m.tx-m.x, dy=m.ty-m.y; let ang=Math.atan2(dy,dx); m.x+=Math.cos(ang)*m.dy; m.y+=Math.sin(ang)*m.dy;
   if(m.y>350){ enemies.splice(i,1); score-=10; } ctx.strokeStyle="#f00"; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-Math.cos(ang)*8,m.y-Math.sin(ang)*8); ctx.stroke(); ctx.fillStyle="#f00"; ctx.fillRect(m.x, m.y,4,4);
  });
  // ciudades
  ctx.fillStyle="#0f0"; enemies.cities.forEach(c=>{ ctx.fillRect(c.x,360,20,20); ctx.fillRect(c.x+4,350,12,10); });
  // mira
  ctx.strokeStyle="#0ff"; ctx.strokeRect(player.x-10,player.y-10,20,20); ctx.beginPath(); ctx.moveTo(player.x,player.y-10); ctx.lineTo(player.x,player.y+10); ctx.moveTo(player.x-10,player.y); ctx.lineTo(player.x+10,player.y); ctx.stroke();
  score++; if(score>600) win();
 }
 else if(mode.t==='pacman'){
  bullets.forEach(p=>{ if(!p.e){ ctx.fillStyle="#ff0"; ctx.fillRect(p.x,p.y,4,4); if(Math.hypot(player.x-p.x,player.y-p.y)<14){ p.e=true; score+=10; } }});
  if(bullets.every(p=>p.e)) return win();
  enemies.forEach(e=>{ e.x+=(player.x-e.x)*0.008; e.y+=(player.y-e.y)*0.008; if(Math.hypot(player.x-e.x,player.y-e.y)<14) return gameOver(); ctx.fillStyle=e.c; ctx.beginPath(); ctx.arc(e.x,e.y,9,0,6.28); ctx.fill(); });
  ctx.fillStyle="#ff0"; ctx.beginPath(); ctx.arc(player.x,player.y,10,0.3,5.9); ctx.lineTo(player.x,player.y); ctx.fill();
 }
 else if(mode.t==='frogger'||mode.t==='freeway'){
  enemies.forEach(e=>{ e.x+=e.dir*e.sp; if(e.x>340) e.x=-70; if(e.x<-70) e.x=340; if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y) return gameOver(); ctx.fillStyle=e.dir>0?"#fa0":"#0af"; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.fillStyle="#000"; ctx.fillRect(e.x+6,e.y+4,12,4); ctx.fillRect(e.x+40,e.y+4,12,4); });
  ctx.fillStyle="#0f0"; ctx.fillRect(player.x,player.y,player.w,player.h); if(player.y<25) return win();
 }
 else if(mode.t==='river'||mode.t==='barn'){
  if(Math.random()<0.04) enemies.push({x:Math.random()*200+40,y:-20,w:20,h:20,dy:2+nivel*0.2});
  enemies.forEach(e=>{ e.y+=e.dy; if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y) return gameOver(); });
  enemies=enemies.filter(e=>e.y<420); score+=1;
  // rio
  ctx.fillStyle="#00a"; ctx.fillRect(40,0,20,400); ctx.fillRect(260,0,20,400);
  ctx.fillStyle="#ff0"; ctx.fillRect(player.x,player.y,player.w,player.h); ctx.fillRect(player.x+4,player.y-8,10,8);
  ctx.fillStyle="#f00"; enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));
  if(score>700) win();
 }
 else if(mode.t==='seaquest'){
  if(Math.random()<0.05) enemies.push({x:320,y:Math.random()*300+40,w:24,h:10,dy:0,dx:-2});
  enemies.forEach(e=>{ e.x+=e.dx; if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y) return gameOver(); });
  enemies=enemies.filter(e=>e.x>-30); score++;
  ctx.fillStyle="#0ff"; ctx.fillRect(player.x,player.y,30,10); ctx.fillRect(player.x+20,player.y-4,10,6);
  ctx.fillStyle="#f80"; enemies.forEach(e=>{ ctx.fillRect(e.x,e.y,e.w,e.h); ctx.beginPath(); ctx.moveTo(e.x,e.y+5); ctx.lineTo(e.x-8,e.y); ctx.lineTo(e.x-8,e.y+10); ctx.fill(); });
 }
 else if(mode.t==='enduro'){
  if(Math.random()<0.08) enemies.push({x:80+Math.random()*120,y:-30,w:30,h:40,dy:4+nivel});
  enemies.forEach(e=>{ e.y+=e.dy; if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y>300&&e.y<390) return gameOver(); });
  enemies=enemies.filter(e=>e.y<420); score++;
  ctx.fillStyle="#555"; ctx.fillRect(60,0,200,400); ctx.fillStyle="#fff"; ctx.fillRect(60,0,4,400); ctx.fillRect(256,0,4,400);
  ctx.setLineDash([12,12]); ctx.strokeStyle="#fff"; ctx.beginPath(); ctx.moveTo(160,0); ctx.lineTo(160,400); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle="#0f0"; ctx.fillRect(player.x,350,player.w,40); ctx.fillStyle="#f00"; enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));
 }
 else { // resto generico pero con color distinto por juego
  if(Math.random()<0.05) enemies.push({x:Math.random()*300,y:-20,w:18,h:18,dy:2+nivel*0.2});
  enemies.forEach(e=>{ e.y+=e.dy; if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y) return gameOver(); });
  enemies=enemies.filter(e=>e.y<420); score++; if(score>600) nivel++;
  ctx.fillStyle=mode.id%3==0?'#0ff':mode.id%3==1?'#ff0':'#f0f'; ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle="#f00"; enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));
 }

 document.getElementById('t2').innerText=`SCORE ${score}`; requestAnimationFrame(loop);
}
function win(){ running=false; coins+=40; localStorage.setItem('coins',coins); if(typeof show_12010451==='function'){ show_12010451().then(()=>{ nivel++; running=true; loop(); }).catch(()=>{ nivel++; running=true; loop(); }); } else { nivel++; running=true; loop(); } }
function gameOver(){ running=false; document.getElementById('oT').innerText=mode.n; document.getElementById('oM').innerText=`SCORE ${score}`; document.getElementById('over').classList.add('show'); }

document.getElementById('left').ontouchstart=e=>{ if(player) player.x=Math.max(0,player.x-20); e.preventDefault(); };
document.getElementById('right').ontouchstart=e=>{ if(player) player.x=Math.min(300,player.x+20); e.preventDefault(); };
document.getElementById('fire').ontouchstart=e=>{
 if(mode.t==='invaders'||mode.t==='galaga') bullets.push({x:player.x+12,y:player.y,dy:-5,p:true});
 else if(mode.t==='asteroids') bullets.push({x:player.x,y:player.y,dx:Math.cos(player.a)*5,dy:Math.sin(player.a)*5,l:60});
 else if(mode.t==='missile'){ player.x=Math.random()*260+20; player.y=Math.random()*200+100; }
 else if(player.y!==undefined) player.y=Math.max(20,player.y-24);
 e.preventDefault();
};
document.getElementById('btnR').onclick=()=>{ if(typeof show_12010449==='function'){ show_12010449().then(()=>{ document.getElementById('over').classList.remove('show'); running=true; loop(); }); } };

render();
</script>
</body>
</html>
