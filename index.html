<style>
#btnLike{
  background:#7fff00;color:#000;width:90%;max-width:360px;
  padding:28px;font-size:32px;font-weight:900;border:0;border-radius:20px;
  display:block;margin:20px auto;
}
#contador{text-align:center;font-weight:800;font-size:18px;font-family:Arial}
</style>

<button id="btnLike" onclick="darLike()">👍 ME GUSTA <span id="numLikes">...</span></button>
<div id="contador">👥 Global: <span id="numVisitas">...</span> personas</div>

<script>
const NAMESPACE = "daleplay1-oficial-2026";

// VISITAS GLOBAL
fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/visitas`)
.then(r=>r.json()).then(d=>{
  document.getElementById('numVisitas').innerText = d.value;
});

// LIKES GLOBAL
fetch(`https://api.countapi.xyz/get/${NAMESPACE}/likes`)
.then(r=>r.json()).then(d=>{
  document.getElementById('numLikes').innerText = d.value || 0;
}).catch(()=>{
  document.getElementById('numLikes').innerText = 0;
});

function darLike(){
  if(localStorage.getItem('ya_like')) return alert('Ya diste like 👍');
  fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/likes`)
  .then(r=>r.json()).then(d=>{
    document.getElementById('numLikes').innerText = d.value;
    localStorage.setItem('ya_like','1');
  });
  if(navigator.vibrate) navigator.vibrate(50);
}
</script>
