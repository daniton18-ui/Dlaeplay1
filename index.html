<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DALEPLAY1</title>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
body{margin:0;background:#071a0a;font-family:Arial;text-align:center}
.header{background:#7fff00;color:#000;padding:14px;font-weight:900;font-size:20px}
.header small{display:block;font-size:12px}
.cont{color:#7fff00;border:2px solid #7fff00;border-radius:12px;margin:12px;padding:10px;font-weight:bold}
.grid{width:95%;max-width:360px;margin:10px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.box{height:60px;background:#152e18;border:2px solid #7fff00;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;cursor:pointer}
#btn{margin:15px auto;background:#333;color:#fff;border:0;padding:14px;width:90%;max-width:360px;border-radius:12px;font-weight:900;display:none}
#btn.activo{background:#7fff00;color:#000}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:99}
.caja{background:#112d18;border:3px solid #7fff00;padding:22px;border-radius:18px;margin:20px}
</style>
</head>
<body>
<div class="header">GANA CON DALEPLAY1<small>PREMIOS DESDE 2000 PESOS COP HASTA 10000 PESOS COP</small></div>
<div class="cont" id="ci">Intentos gratis: 2/2</div>
<div class="grid" id="g"></div>
<button id="btn">ESPERA 15s PARA 2DA OPORTUNIDAD</button>

<div id="modal"><div class="caja">
<h1 style="color:#7fff00;margin:0">FELICIDADES</h1>
<h2 style="color:#fff" id="premioTxt">GANASTE 2000 PESOS COP</h2>
<p>Código: <b id="cod" style="color:#7fff00"></b></p>
<button onclick="reclamarFinal()" style="background:#7fff00;color:#000;border:0;padding:14px;width:100%;border-radius:10px;font-weight:900">RECLAMAR</button>
</div></div>

<script>
const BOT_TOKEN = "8892598385:AAEe41lVBI57SttwkfbQTdFdA0DsIBrtsMY";
const TU_CHAT_ID = "6277586169";

// --- MONETAG IN-APP AUTOMATICO ---
show_12010449({
  type: 'inApp',
  inAppSettings: {
    frequency: 2,
    capping: 0.1,
    interval: 30,
    timeout: 5,
    everyPage: false
  }
});

let intentos=2, encontrados=0, ganadoras=[], timer=null;
let g=document.getElementById('g');

function enviarNotificacion(monto, codigo){
  if(encontrados !== 2) return;
  let tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
  let username = tg ? '@'+(tg.username || tg.first_name) : 'Usuario Web';
  let mensaje = `💎 NUEVO GANADOR DALEPLAY1\n\n👤 Usuario: ${username}\n💰 Premio: ${monto} COP\n🔑 Código: ${codigo}\n⏰ ${new Date().toLocaleString()}`;
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:TU_CHAT_ID, text:mensaje})
  });
}

function crear(){ g.innerHTML=''; for(let i=0;i<25;i++){ let d=document.createElement('div'); d.className='box'; d.innerText='?'; d.onclick=()=>jugar(i,d); g.appendChild(d); } barajar(); }
function barajar(){ ganadoras=[]; while(ganadoras.length<2){let r=Math.floor(Math.random()*25); if(!ganadoras.includes(r)) ganadoras.push(r);} }
function actualizar(){ document.getElementById('ci').innerText='Intentos gratis: '+intentos+'/2'; if(intentos<=0) iniciarEspera15(); else document.getElementById('btn').style.display='none'; }
function jugar(i,d){
 if(intentos<=0) return; if(d.dataset.ok) return;
 intentos--; actualizar();
 show_12010449(); // tu formato original por cada intento
 if(ganadoras.includes(i)){
  d.innerText='💎'; d.style.background='#7fff00'; d.style.color='#000'; d.dataset.ok=1; encontrados++;
  if(encontrados==2){
   let montos=[2000,2000,2000,5000,10000];
   let montoElegido = montos[Math.floor(Math.random()*montos.length)];
   let codigo = 'DP-'+Math.floor(Math.random()*90000+10000);
   document.getElementById('premioTxt').innerText='GANASTE '+montoElegido+' PESOS COP';
   document.getElementById('cod').innerText=codigo;
   document.getElementById('modal').style.display='flex';
   enviarNotificacion(montoElegido, codigo);
  }
 }else{ d.innerText='💣'; setTimeout(()=>{ if(!d.dataset.ok) d.innerText='?'; },600); }
}
function iniciarEspera15(){
 let btn=document.getElementById('btn'); btn.style.display='block'; btn.classList.remove('activo');
 let seg=15; btn.innerText='ESPERA '+seg+'s PARA 2DA OPORTUNIDAD'; btn.onclick=null;
 if(timer) clearInterval(timer);
 timer=setInterval(()=>{ seg--; if(seg>0){ btn.innerText='ESPERA '+seg+'s PARA 2DA OPORTUNIDAD'; }else{ clearInterval(timer); btn.innerText='▶ VER ANUNCIO PARA +2 INTENTOS'; btn.classList.add('activo'); btn.onclick=verAnuncioRecarga; } },1000);
}
function verAnuncioRecarga(){
  show_12010449('pop').then(() => {
    intentos=2; encontrados=0; crear(); actualizar();
  }).catch(()=>{ intentos=2; encontrados=0; crear(); actualizar(); });
}
function reclamarFinal(){
  show_12010449('pop').then(() => {
    document.getElementById('modal').style.display='none'; intentos=0; actualizar();
  }).catch(()=>{ document.getElementById('modal').style.display='none'; intentos=0; actualizar(); });
}
crear(); actualizar();
setInterval(()=>{if(intentos>0) barajar();},3000);
</script>
</body>
</html>
