<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ATARI 40 GAMES</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<script src="//libtl.com/sdk.js" data-zone="12010451" data-sdk="show_12010451"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#000;color:#0f0;font-family:'Press Start 2P',monospace;text-align:center}
 #menu{padding:12px}
 #grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
 .card{background:linear-gradient(#222,#111);border:3px solid #333;border-radius:0;padding:10px;cursor:pointer;image-rendering:pixelated}
 .card:active{border-color:#0f0;background:#0a1a0a;transform:scale(0.96)}
 .card .ico{font-size:32px;filter:contrast(0) sepia(1) hue-rotate(90deg) saturate(5)}
 .card b{font-size:8px;display:block;margin-top:8px;line-height:12px}
 canvas{background:#000;display:none;margin:8px auto;border:4px solid #333;image-rendering:pixelated}
 #top{display:none;justify-content:space-between;padding:8px;background:#111;font-size:8px;margin:5px}
 #controls{display:none;justify-content:center;gap:8px;margin:8px}
 .ctrl{width:70px;height:70px;background:#222;border:3px solid #444;font-family:'Press Start 2P';font-size:10px;color:#0f0}
 .ctrl:active{background:#0f0;color:#000}
 #over{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:99;border:6px solid #0f0}
 #over.show{display:flex}
 button.action{padding:12px;width:90%;max-width:340px;background:#0f0;border:0;color:#000;font-family:'Press Start 2P';font-size:10px;margin:8px}
 button.action.sec{background:#222;color:#0f0;border:2px solid #0f0}
</style>
</head>
<body>
<div id="menu">
  <h2 style="font-size:14px;color:#ff0">ATARI 40 GAMES</h2>
  <p style="font-size:7px;color:#555">SELECT GAME - COINS: <b id="coinsMenu">0</b></p>
  <div id="grid"></div>
</div>
<div id="top"><span id="t1"></span><span id="t2"></span><button style="background:#222;border:2px solid #0f0;color:#0f0;font-family:'Press Start 2P';font-size:7px;padding:4px" onclick="goMenu()">MENU</button></div>
<canvas id="game" width="320" height="400"></canvas>
<div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="fire">FIRE</button><button class="ctrl" id="right">▶</button></div>
<div id="over"><h2 id="overTitle" style="font-size:12px"></h2><p id="overMsg" style="font-size:8px"></p><button class="action" id="btnRevive">AD REVIVE 12010449</button><button class="action sec" onclick="goMenu()">ATARI MENU</button></div>

<script>
const tg=Telegram.WebApp; tg.ready(); tg.expand();
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let coins=parseInt(localStorage.getItem('coins')||0), mode=null, running=false, score=0, nivel=1, player, ball, bullets=[], enemies=[], vy=0;

const ATARI=[
 {id:1,name:"BREAKOUT",icon:"🧱",type:"breakout"},
 {id:2,name:"PONG",icon:"🏓",type:"pong"},
 {id:3,name:"SPACE INVADERS",icon:"👾",type:"invaders"},
 {id:4,name:"ASTEROIDS",icon:"☄️",type:"asteroids"},
 {id:5,name:"MISSILE COMMAND",icon:"🚀",type:"missile"},
 {id:6,name:"CENTIPEDE",icon:"🐛",type:"centipede"},
 {id:7,name:"FROGGER",icon:"🐸",type:"frogger"},
 {id:8,name:"PAC-MAN",icon:"🟡",type:"pacman"},
 {id:9,name:"DONKEY KONG",icon:"🦍",type:"kong"},
 {id:10,name:"GALAGA",icon:"👽",type:"galaga"},
 {id:11,name:"DEFENDER",icon:"🛸",type:"defender"},
 {id:12,name:"PITFALL",icon:"🕳️",type:"pitfall"},
 {id:13,name:"RIVER RAID",icon:"✈️",type:"river"},
 {id:14,name:"COMBAT TANKS",icon:"🪖",type:"tanks"},
 {id:15,name:"YARS REVENGE",icon:"🪰",type:"yars"},
 {id:16,name:"BERZERK",icon:"🤖",type:"berzerk"},
 {id:17,name:"KABOOM!",icon:"💣",type:"kaboom"},
 {id:18,name:"SEAQUEST",icon:"🦈",type:"seaquest"},
 {id:19,name:"ENDURO",icon:"🏎️",type:"enduro"},
 {id:20,name:"Q*BERT",icon:"🔶",type:"qbert"},
 {id:21,name:"DIG DUG",icon:"⛏️",type:"digdug"},
 {id:22,name:"JUNGLE HUNT",icon:"🌴",type:"jungle"},
 {id:23,name:"POPEYE",icon:"💪",type:"popeye"},
 {id:24,name:"Joust",icon:"🦅",type:"joust"},
 {id:25,name:"MOON PATROL",icon:"🌙",type:"moon"},
 {id:26,name:"BURGERTIME",icon:"🍔",type:"burger"},
 {id:27,name:"KEYSTONE KAPERS",icon:"👮",type:"keystone"},
 {id:28,name:"HERO",icon:"🦸",type:"hero"},
 {id:29,name:"BARNSTORMING",icon:"🛩️",type:"barn"},
 {id:30,name:"BOXING",icon:"🥊",type:"boxing"},
 {id:31,name:"BOWLING",icon:"🎳",type:"bowling"},
 {id:32,name:"SKIING",icon:"🎿",type:"skiing"},
 {id:33,name:"TENNIS",icon:"🎾",type:"tennis"},
 {id:34,name:"ICE HOCKEY",icon:"🏒",type:"hockey"},
 {id:35,name:"FISHING DERBY",icon:"🎣",type:"fishing"},
 {id:36,name:"CIRCUS",icon:"🤹",type:"circus"},
 {id:37,name:"LASER BLAST",icon:"🔫",type:"laser"},
 {id:38,name:"DEMON ATTACK",icon:"👹",type:"demon"},
 {id:39,name:"FREEWAY",icon:"🐔",type:"freeway"},
 {id:40,name:"ATARI BOSS RUSH",icon:"👑",type:"boss"},
];

function renderMenu(){
  document.getElementById('coinsMenu').innerText=coins;
  let h=''; ATARI.forEach(g=>{ h+=`<div class="card" onclick="startGame(${g.id})"><div class="ico">${g.icon}</div><b>${g.name}</b></div>`; });
  document.getElementById('grid').innerHTML=h;
}
function goMenu(){ running=false; mode=null; document.getElementById('menu').style.display='block'; document.getElementById('top').style.display='none'; canvas.style.display='none'; document.getElementById('controls').style.display='none'; document.getElementById('over').classList.remove('show'); }

function startGame(id){
  let g=ATARI.find(x=>x.id===id); mode=g; score=0; nivel=1; bullets=[]; enemies=[]; vy=0;
  document.getElementById('menu').style.display='none'; document.getElementById('top').style.display='flex'; canvas.style.display='block'; document.getElementById('controls').style.display='flex';
  document.getElementById('t1').innerText=g.name; 
  if(g.type==='breakout'){ player={x:120,w:60}; ball={x:160,y:200,dx:2.5,dy:-2.5,r:4}; enemies=[]; for(let r=0;r<6;r++) for(let c=0;c<8;c++) enemies.push({x:c*38+8,y:r*16+40,alive:true}); }
  else if(g.type==='pong'){ player={y:160,h:50}; ball={x:160,y:200,dx:3,dy:2,r:4}; enemies=[{y:160,h:50,dir:2}]; }
  else { player={x:140,y:360,w:20,h:20}; }
  running=true; loop();
}

function loop(){
  if(!running) return;
  ctx.fillStyle="#000"; ctx.fillRect(0,0,320,400);
  // scanlines retro
  ctx.fillStyle="rgba(0,255,0,0.03)"; for(let y=0;y<400;y+=4) ctx.fillRect(0,y,320,1);

  if(mode.type==='breakout'){
    ball.x+=ball.dx; ball.y+=ball.dy; if(ball.x<0||ball.x>316) ball.dx*=-1; if(ball.y<0) ball.dy*=-1;
    if(ball.y>360 && ball.x>player.x && ball.x<player.x+player.w) ball.dy=-Math.abs(ball.dy);
    enemies.forEach(b=>{ if(b.alive && ball.x>b.x && ball.x<b.x+36 && ball.y>b.y && ball.y<b.y+12){ b.alive=false; ball.dy*=-1; score+=10; }});
    if(ball.y>410) gameOver(); if(enemies.every(b=>!b.alive)) winLevel();
    ctx.fillStyle="#0f0"; ctx.fillRect(player.x,380,player.w,8); ctx.fillStyle="#ff0"; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); enemies.forEach(b=>{ if(b.alive){ ctx.fillStyle=b.y<80?"#f00":"#0ff"; ctx.fillRect(b.x,b.y,34,10);} });
  } else if(mode.type==='pong'){
    ball.x+=ball.dx; ball.y+=ball.dy; if(ball.y<0||ball.y>396) ball.dy*=-1;
    if(ball.x<20 && ball.y>player.y && ball.y<player.y+player.h) ball.dx=3; if(ball.x>300 && ball.y>enemies[0].y && ball.y<enemies[0].y+enemies[0].h) ball.dx=-3;
    enemies[0].y+=enemies[0].dir; if(enemies[0].y<0||enemies[0].y>350) enemies[0].dir*=-1;
    if(ball.x<0||ball.x>320){ score+=10; ball={x:160,y:200,dx:3*(Math.random()>0.5?1:-1),dy:2,r:4}; if(score>100) winLevel(); }
    ctx.fillStyle="#0f0"; ctx.fillRect(10,player.y,6,player.h); ctx.fillRect(304,enemies[0].y,6,enemies[0].h); ctx.fillRect(ball.x,ball.y,6,6);
  } else if(['invaders','galaga','demon','laser'].includes(mode.type)){
    if(Math.random()<0.02) enemies.push({x:Math.random()*280,y:0,w:16,h:16,dy:1+nivel*0.2});
    if(Math.random()<0.05) bullets.push({x:player.x+8,y:player.y,dy:-5});
    enemies.forEach(e=>e.y+=e.dy); bullets.forEach(b=>b.y+=b.dy);
    enemies=enemies.filter(e=>e.y<420); bullets=bullets.filter(b=>b.y>-10);
    enemies.forEach((e,i)=>{ bullets.forEach((b,j)=>{ if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){ enemies.splice(i,1); bullets.splice(j,1); score+=20; }}); if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y) gameOver(); });
    if(score>300) winLevel();
    ctx.fillStyle="#0f0"; ctx.fillRect(player.x,player.y,player.w,player.h); ctx.fillStyle="#f00"; enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h)); ctx.fillStyle="#ff0"; bullets.forEach(b=>ctx.fillRect(b.x,b.y,2,6));
  } else {
    // generico atari runner/dodge
    if(Math.random()<0.06) enemies.push({x:Math.random()*300,y:-20,w:16,h:16,dy:2+nivel*0.3});
    enemies.forEach(e=>e.y+=e.dy); enemies=enemies.filter(e=>e.y<420);
    enemies.forEach(e=>{ if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y) gameOver(); });
    score++; if(score%500===0) nivel++;
    ctx.fillStyle="#0f0"; ctx.fillRect(player.x,player.y,player.w,player.h); ctx.fillStyle="#f00"; enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));
  }
  document.getElementById('t2').innerText=`SCORE ${score}`;
  requestAnimationFrame(loop);
}
function winLevel(){ running=false; coins+=30; localStorage.setItem('coins',coins); if(typeof show_12010451==='function'){ show_12010451().then(()=>{ nivel++; running=true; loop(); }).catch(()=>{ nivel++; running=true; loop(); }); } else { nivel++; running=true; loop(); } }
function gameOver(){ running=false; document.getElementById('overTitle').innerText=mode.name; document.getElementById('overMsg').innerText=`SCORE ${score} LEVEL ${nivel}`; document.getElementById('over').classList.add('show'); }

document.getElementById('left').ontouchstart=e=>{ if(player) player.x=Math.max(0,player.x-20); e.preventDefault(); };
document.getElementById('right').ontouchstart=e=>{ if(player) player.x=Math.min(300,player.x+20); e.preventDefault(); };
document.getElementById('fire').ontouchstart=e=>{ if(mode && ['invaders','galaga'].includes(mode.type)) bullets.push({x:player.x+8,y:player.y,dy:-5}); e.preventDefault(); };
document.getElementById('left').onmousedown=()=>{ if(player) player.x=Math.max(0,player.x-20); };
document.getElementById('right').onmousedown=()=>{ if(player) player.x=Math.min(300,player.x+20); };
document.getElementById('fire').onmousedown=()=>{ if(mode) bullets.push({x:player.x+8,y:player.y,dy:-5}); };
document.getElementById('btnRevive').onclick=()=>{ if(typeof show_12010449==='function'){ show_12010449().then(()=>{ document.getElementById('over').classList.remove('show'); running=true; loop(); }); } };

renderMenu();
</script>
</body>
</html>
