<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DALEPLAY1</title>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
body{margin:0;background:#071a0a;font-family:Arial;text-align:center;color:#fff}
.header{background:#7fff00;color:#000;padding:14px;font-weight:900;font-size:20px}
.cont{color:#7fff00;border:2px solid #7fff00;border-radius:12px;margin:12px;padding:10px;font-weight:bold}
.grid{width:95%;max-width:360px;margin:10px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.box{height:60px;background:#152e18;border:2px solid #7fff00;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;font-weight:900}
.btn{margin:8px auto;border:0;padding:14px;width:90%;max-width:360px;border-radius:12px;font-weight:900;display:block;cursor:pointer}
#btnAnuncio{background:#333;color:#fff;display:none}
#btnAnuncio.activo{background:#7fff00;color:#000}
#btnCompartir{background:#25D366;color:#000}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:99}
.caja{background:#112d18;border:3px solid #7fff00;padding:22px;border-radius:18px;margin:20px}
</style>
</head>
<body>
<div class="header">GANA CON DALEPLAY1</div>
<div class="cont" id="ci"></div>
<div class="grid" id="g"></div>
<button id="btnAnuncio" class="btn"></button>
<button id="btnCompartir" class="btn" onclick="compartirParaGanar()">📤 COMPARTE 0/3 PARA 2 INTENTOS</button>
<div id="modal"><div class="caja"><h1 id="tituloM" style="color:#7fff00"></h1><h2 id="premioTxt"></h2><p id="codigoP">Código: <b id="cod"></b></p><button onclick="reclamarFinal()" id="btnModal" style="background:#7fff00;padding:14px;width:100%;border-radius:10px;font-weight:900">RECLAMAR</button></div></div>

<script>
show_12010449({ type: 'inApp', inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false } });
let intentos=2,intentosUsados=0,ganadora=null,intentosPos=[],adUsado=false,compartidoUsado=false,timer=null,g=document.getElementById('g');
let compartidosContador = parseInt(localStorage.getItem('daleplay_compartidos')||'0');

function checkHora(){
  let data=JSON.parse(localStorage.getItem('daleplay1_hora')||'{}'); let ahora=Date.now();
  if(!data.time || (ahora-data.time)>3600000){
    localStorage.setItem('daleplay1_hora',JSON.stringify({time:ahora,usados:0,ad:false,compartido:false}));
    localStorage.setItem('daleplay_compartidos','0'); compartidosContador=0;
    return {usados:0,ad:false,compartido:false,reset:true};
  }
  return data;
}
function guardarProgreso(){
  let data=JSON.parse(localStorage.getItem('daleplay1_hora')||'{}'); data.usados=intentosUsados; data.ad=adUsado; data.compartido=compartidoUsado; if(!data.time) data.time=Date.now();
  localStorage.setItem('daleplay1_hora',JSON.stringify(data));
}
function crear(){
  g.innerHTML=''; let estado=checkHora(); intentosUsados=estado.usados; adUsado=estado.ad; compartidoUsado=estado.compartido;
  if(intentosUsados>=6){ finPorHora(); return; }
  let todos=[...Array(25).keys()].sort(()=>Math.random()-0.5); ganadora=todos[0]; intentosPos=todos.slice(1,3);
  intentos = estado.reset || estado.usados===0? 2 : Math.max(0,2);
  for(let i=0;i<25;i++){
    let d=document.createElement('div'); d.className='box'; d.innerText='?';
    if(intentosPos.includes(i)){ d.innerHTML='+1<br>INTENTO'; d.onclick=()=>{intentos++; intentosUsados++; show_12010449(); crear();} }
    else{ d.onclick=()=>jugar(i,d); }
    g.appendChild(d);
  }
  let btnC = document.getElementById('btnCompartir');
  btnC.style.display = compartidoUsado?'none':'block';
  btnC.innerText = `📤 COMPARTE ${compartidosContador}/3 PARA 2 INTENTOS`;
  actualizar();
}
function actualizar(){ document.getElementById('ci').innerText=`Oportunidades: ${intentosUsados}/6 | Intentos: ${intentos}`; guardarProgreso(); }
function jugar(i,d){
  if(intentos<=0) return; intentos--; intentosUsados++; actualizar(); show_12010449();
  if(i===ganadora){
    d.innerText='💎'; let monto=[2000,5000,10000][Math.floor(Math.random()*3)]; let codigo='DP-'+Math.floor(Math.random()*90000+10000);
    document.getElementById('tituloM').innerText='GANASTE'; document.getElementById('premioTxt').innerText=monto+' COP'; document.getElementById('cod').innerText=codigo; document.getElementById('modal').style.display='flex';
    window._ultimoCodigo=codigo; window._ultimoMonto=monto;
  } else { d.innerText='💣'; }
}
function compartirParaGanar(){
  if(compartidoUsado) return;
  window.open(`https://wa.me/?text=${encodeURIComponent('Juega DALEPLAY1 https://t.me/tu_bot')}`,'_blank');
  compartidosContador++; localStorage.setItem('daleplay_compartidos',compartidosContador);
  let btn=document.getElementById('btnCompartir');
  if(compartidosContador<3){ btn.innerText=`📤 COMPARTE ${compartidosContador}/3 PARA 2 INTENTOS`; show_12010449(); }
  else { compartidoUsado=true; intentos+=2; guardarProgreso(); btn.innerText='✅ GANASTE 2 INTENTOS!'; show_12010449('pop'); setTimeout(()=>btn.style.display='none',2000); localStorage.setItem('daleplay_compartidos','0'); actualizar(); }
}
function finPorHora(){ document.getElementById('ci').innerText='Se acabaron tus 6 tiros, vuelve en 1 hora'; g.innerHTML=''; }
function reclamarFinal(){
  show_12010449('pop');
  // ENVIA AL BACKEND SEGURO
  fetch('/api/ganador', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({codigo:window._ultimoCodigo, monto:window._ultimoMonto}) });
  document.getElementById('modal').style.display='none'; intentosUsados=6; guardarProgreso(); finPorHora();
}
crear();
</script>
</body>
</html>
