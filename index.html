<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DALEPLAY1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
body{margin:0;background:#0f1419;font-family:Arial;text-align:center;color:#fff;min-height:100vh}
.header{background:#2AABEE;color:#fff;padding:14px;font-weight:900;font-size:20px}
.cont{color:#2AABEE;background:#fff;border:2px solid #2AABEE;border-radius:12px;margin:10px;padding:10px;font-weight:bold}
#timer{color:#333;background:#fff;border:1px dashed #2AABEE;border-radius:10px;margin:8px 12px;padding:8px;font-size:14px}
.grid{width:95%;max-width:360px;margin:15px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-height:320px}
.box{height:60px;background:#fff;border:2px solid #2AABEE;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;font-weight:900;color:#2AABEE;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.box.abierto{background:#e3f2fd;color:#888;border-color:#ccc}
.btn{margin:8px auto;border:0;padding:14px;width:90%;max-width:360px;border-radius:25px;font-weight:900;display:block;cursor:pointer}
#btnAnuncio{background:#2AABEE;color:#fff;font-size:16px}
#btnLike{background:#1877F2;color:#fff;border:0;font-size:15px;box-shadow:0 3px 10px rgba(24,119,242,0.4)}
#btnMensajePersonal{background:#fff;color:#0f1419;border:2px solid #2AABEE}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:99}
.caja{background:#fff;border:3px solid #2AABEE;padding:22px;border-radius:18px;margin:20px;color:#000}
#modalUsuario{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100}
#modalUsuario .caja{width:85%;max-width:320px}
#modalUsuario input{width:90%;padding:12px;border-radius:10px;border:2px solid #2AABEE;background:#f5f5f5;color:#000;font-weight:700;text-align:center;margin:12px 0}
.boxMensaje{width:90%;max-width:360px;margin:20px auto;background:#fff;border:2px solid #2AABEE;border-radius:16px;padding:12px}
.boxMensaje textarea{width:92%;height:70px;border-radius:10px;padding:10px;background:#f5f5f5;color:#000;border:1px solid #2AABEE;resize:none;font-family:Arial}
</style>
</head>
<body>
<div class="header">🍟 DALEPLAY1 - GANA DE 1$ A 5$ TODO LOS DIAS</div>
<div class="cont" id="ci">Intentos: 2 | Puntos: 0</div>
<div id="timer">⏳ Reinicio en: 60:00</div>
<div class="grid" id="g"></div>

<button id="btnAnuncio" class="btn">📺 VER ANUNCIO 0/2 PARA +1 INTENTO</button>
<button id="btnLike" class="btn">👍 ME GUSTA AZUL <span id="likeCount">0</span></button>

<div class="boxMensaje">
  <p style="color:#2AABEE;font-weight:900;margin:5px">💬 ¿QUIERES HABLAR CONMIGO?</p>
  <textarea id="txtPersonal" placeholder="Hola amigo cómo estás quiero comunicarme contigo..."></textarea>
  <button id="btnMensajePersonal" class="btn">✉️ ENVIAR MENSAJE</button>
</div>

<div id="modal"><div class="caja"><h1 style="color:#2AABEE">¡GANASTE! 🍟</h1><p>Código: <b id="cod"></b></p><p id="idTxt"></p><button onclick="location.reload()" style="background:#2AABEE;color:#fff;padding:14px;width:100%;border-radius:10px;font-weight:900;border:0">RECLAMAR</button></div></div>

<div id="modalUsuario"><div class="caja">
  <h2 style="color:#2AABEE;margin:0">¡CASI LISTO!</h2>
  <p style="font-size:14px">Escribe tu @usuario para darte el intento</p>
  <input id="inputUsuario" type="text" placeholder="@tu_usuario">
  <button onclick="guardarUsuario()" style="background:#2AABEE;color:#fff;padding:14px;width:100%;border-radius:10px;font-weight:900;border:0;cursor:pointer">GUARDAR +1 INTENTO</button>
</div></div>

<script>
let tg = window.Telegram ? window.Telegram.WebApp : null;
let USER_ID = 'anon'; let USER_NAME = 'Jugador';
if(tg?.initDataUnsafe?.user){ USER_ID = tg.initDataUnsafe.user.id.toString(); USER_NAME = tg.initDataUnsafe.user.first_name||'Jugador'; try{tg.expand();tg.ready();}catch(e){}}
function k(n){return 'dale_'+USER_ID+'_'+n;}
function safeShow(){try{if(typeof show_12010449!=='undefined') return show_12010449();}catch(e){} return Promise.resolve();}

const API_BASE = 'https://abacus.jasoncameron.dev';
async function getCounter(name){try{let r=await fetch(`${API_BASE}/get/daleplay1-${name}`);let d=await r.json();return d.value;}catch(e){return null;}}
async function hitCounter(name){try{let r=await fetch(`${API_BASE}/hit/daleplay1-${name}`);let d=await r.json();return d.value;}catch(e){return null;}}

let hoyKey = new Date().toLocaleDateString('es-CO',{timeZone:'America/Bogota'}).replace(/\//g,'-');
let hayGanadorGlobal = false;
function esSabadoHoy(){let d=new Date().toLocaleString('es-CO',{timeZone:'America/Bogota',weekday:'long'}).toLowerCase();return d.includes('sábado')||d.includes('sabado');}
(async()=>{let w=await getCounter('winner-'+hoyKey);hayGanadorGlobal=w&&w>0;await hitCounter('views-total');})();

let UNA_HORA=60*60*1000;
let horaGuardada=parseInt(localStorage.getItem(k('hora'))||'0');
if(!horaGuardada){horaGuardada=Date.now();localStorage.setItem(k('hora'),horaGuardada);}
setInterval(()=>{
  let diff=(horaGuardada+UNA_HORA)-Date.now();
  if(diff<=0){localStorage.setItem(k('intentos'),'2');localStorage.setItem(k('descubiertas'),'[]');localStorage.removeItem(k('ganadora'));localStorage.setItem(k('anuncios'),'0');localStorage.setItem(k('hora'),Date.now().toString());location.reload();return;}
  let m=Math.floor(diff/60000);let s=Math.floor((diff%60000)/1000);
  document.getElementById('timer').innerText=`⏳ Reinicio en: ${m}:${s.toString().padStart(2,'0')}`;
},1000);

let g=document.getElementById('g'); let ci=document.getElementById('ci'); let btnAnuncio=document.getElementById('btnAnuncio');
let intentos=parseInt(localStorage.getItem(k('intentos'))||'2');
let puntos=parseInt(localStorage.getItem(k('puntos'))||'0');
let anuncios=parseInt(localStorage.getItem(k('anuncios'))||'0');
let ganadora=parseInt(localStorage.getItem(k('ganadora'))||'');
if(isNaN(ganadora)){ganadora=Math.floor(Math.random()*25);localStorage.setItem(k('ganadora'),ganadora.toString());}
let descubiertas=JSON.parse(localStorage.getItem(k('descubiertas'))||'[]');
if(!Array.isArray(descubiertas) || descubiertas.length>=25){descubiertas=[];localStorage.setItem(k('descubiertas'),'[]');}

function crear(){
  g.innerHTML='';
  for(let i=0;i<25;i++){
    let d=document.createElement('div');d.className='box';
    if(descubiertas.includes(i)){d.innerText=(i===ganadora?'💎':'💣');d.classList.add('abierto');}
    else{d.innerText='?';d.onclick=()=>jugar(i,d);}
    g.appendChild(d);
  }
  ci.innerText=`Intentos: ${intentos} | Puntos: ${puntos}`;
  if(anuncios>=2){btnAnuncio.innerText='✅ YA VISTE 2 ANUNCIOS';btnAnuncio.disabled=true;btnAnuncio.style.opacity='0.6';}
  else{btnAnuncio.innerText=`📺 VER ANUNCIO ${anuncios}/2 PARA +1 INTENTO`;}
  let u=localStorage.getItem(k('usuario_tg')); if(u) document.getElementById('inputUsuario').value=u;
}
function sumarPuntos(c){puntos+=c;localStorage.setItem(k('puntos'),puntos.toString());ci.innerText=`Intentos: ${intentos} | Puntos: ${puntos}`;}

async function jugar(i,d){
  if(intentos<=0 || descubiertas.includes(i)) return;
  if(!esSabadoHoy()){
    intentos--; descubiertas.push(i); localStorage.setItem(k('intentos'),intentos.toString()); localStorage.setItem(k('descubiertas'),JSON.stringify(descubiertas));
    await safeShow(); d.innerText='💣'; d.classList.add('abierto'); sumarPuntos(10);
    if(i===ganadora){localStorage.removeItem(k('ganadora')); ganadora=Math.floor(Math.random()*25); localStorage.setItem(k('ganadora'),ganadora.toString()); localStorage.setItem(k('descubiertas'),'[]'); setTimeout(crear,800);}
    return;
  }
  if(hayGanadorGlobal){alert('¡YA HAY GANADOR HOY SÁBADO!');return;}
  intentos--; descubiertas.push(i); localStorage.setItem(k('intentos'),intentos.toString()); localStorage.setItem(k('descubiertas'),JSON.stringify(descubiertas)); await safeShow();
  if(i===ganadora){
    let check=await getCounter('winner-'+hoyKey);
    if(check&&check>0){alert('Te ganaron por segundos.'); hayGanadorGlobal=true; location.reload(); return;}
    await hitCounter('winner-'+hoyKey); hayGanadorGlobal=true; d.innerText='💎';
    let codigo='SABADO-'+Math.floor(Math.random()*90000+10000);
    let userFinal = localStorage.getItem(k('usuario_tg')) || USER_NAME;
    document.getElementById('cod').innerText=codigo; document.getElementById('idTxt').innerText='ID:'+USER_ID+' | USER:'+userFinal;
    document.getElementById('modal').style.display='flex'; sumarPuntos(500);
    try{tg.sendData(`GANADOR|ID:${USER_ID}|USER:${userFinal}|COD:${codigo}`);}catch(e){}
  }else{d.innerText='💣'; d.classList.add('abierto'); sumarPuntos(10);}
}

btnAnuncio.onclick=async()=>{
  if(anuncios>=2) return;
  btnAnuncio.innerText='⏳ CARGANDO ANUNCIO...'; btnAnuncio.disabled=true;
  await safeShow();
  document.getElementById('modalUsuario').style.display='flex';
  btnAnuncio.innerText=`📺 VER ANUNCIO ${anuncios}/2 PARA +1 INTENTO`; btnAnuncio.disabled=false;
}

function guardarUsuario(){
  let usuario = document.getElementById('inputUsuario').value.trim();
  if(usuario.length<3){alert("Escribe tu usuario");return;}
  if(!usuario.startsWith('@')) usuario='@'+usuario;
  localStorage.setItem(k('usuario_tg'), usuario);
  anuncios++; intentos++;
  localStorage.setItem(k('anuncios'),anuncios.toString());
  localStorage.setItem(k('intentos'),intentos.toString());
  ci.innerText=`Intentos: ${intentos} | Puntos: ${puntos}`;
  document.getElementById('modalUsuario').style.display='none';
  if(anuncios>=2){btnAnuncio.innerText='✅ YA VISTE 2 ANUNCIOS';btnAnuncio.disabled=true;btnAnuncio.style.opacity='0.6';}
  else{btnAnuncio.innerText=`📺 VER ANUNCIO ${anuncios}/2 PARA +1 INTENTO`;}
  try{tg.sendData(`NUEVO_USER|ID:${USER_ID}|USER:${usuario}`);}catch(e){}
}

document.getElementById('btnMensajePersonal').onclick = async () => {
  let txt = document.getElementById('txtPersonal').value.trim();
  if(txt.length < 4){ alert("Escribe tu mensaje primero"); return; }
  let btn = document.getElementById('btnMensajePersonal');
  btn.innerText='⏳ CARGANDO ANUNCIO...'; btn.disabled=true;
  await safeShow(); await safeShow();
  let userFinal = localStorage.getItem(k('usuario_tg')) || USER_NAME;
  let mensajeCorto = txt.substring(0,400);
  try{
    tg.sendData(`MENSAJE_PERSONAL|ID:${USER_ID}|USER:${userFinal}|MSG:${mensajeCorto}`);
    alert("✅ Mensaje enviado! Te respondo por Telegram");
    document.getElementById('txtPersonal').value="";
  }catch(e){ alert("Abre la app dentro de Telegram"); }
  btn.innerText='✉️ ENVIAR MENSAJE'; btn.disabled=false;
}

// === LIKE AZUL CON ANUNCIO QUE MAS PAGA ===
let btnLike = document.getElementById('btnLike');
let likeCountEl = document.getElementById('likeCount');
async function cargarLikes(){
  let total = await getCounter('likes-total');
  if(total!==null) likeCountEl.innerText = total;
  if(localStorage.getItem(k('like'))==='1'){
    btnLike.innerHTML = `💙 TE GUSTA 👍 <span id="likeCount">${total||0}</span>`;
    btnLike.style.background='#2AABEE';
  }
}
cargarLikes();

btnLike.onclick = async () => {
  if(localStorage.getItem(k('like'))==='1'){
    alert("Ya le diste like bro 💙");
    return;
  }
  btnLike.innerText='⏳ CARGANDO ANUNCIO...'; btnLike.disabled=true;
  // ANUNCIO QUE MAS PAGA - DOBLE
  await safeShow();
  await safeShow();
  let nuevo = await hitCounter('likes-total');
  localStorage.setItem(k('like'),'1');
  btnLike.innerHTML = `💙 TE GUSTA 👍 <span id="likeCount">${nuevo||0}</span>`;
  btnLike.style.background='#2AABEE';
  btnLike.disabled=false;
  try{ tg.sendData(`LIKE|ID:${USER_ID}|USER:${localStorage.getItem(k('usuario_tg'))||USER_NAME}`);}catch(e){}
}

document.addEventListener('DOMContentLoaded', crear);
crear();
</script>
</body>
</html>
