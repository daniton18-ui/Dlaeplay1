<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DALEPLAY1 - RULETA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
body{margin:0;background:#0a0a0a;font-family:Arial;text-align:center;color:#fff;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(90deg,#2AABEE,#0f1419);color:#fff;padding:14px;font-weight:900;font-size:18px;letter-spacing:1px;border-bottom:2px solid #FFD700}
.cont{color:#FFD700;background:#1a1a1a;border:1px solid #FFD700;border-radius:25px;margin:10px auto;padding:8px 15px;font-weight:bold;width:90%;max-width:360px;font-size:13px}
#timer{color:#aaa;background:#1a1a1a;border:1px dashed #444;border-radius:10px;margin:8px auto;padding:8px;font-size:13px;width:90%;max-width:360px}
/* RULETA CASINO */
#ruletaSection{padding:15px 0}
#ruletaWrap{position:relative;width:320px;height:320px;margin:0 auto}
#canvasRuleta{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px #1a1a1a, 0 0 0 12px #FFD700, 0 0 40px rgba(255,215,0,0.5);transition:transform 4.5s cubic-bezier(0.1,0,0.1,1)}
#flecha{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid #fff;z-index:10;filter:drop-shadow(0 2px 5px #000)}
#centro{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:radial-gradient(#333,#000);border:3px solid #FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;z-index:5;box-shadow:0 0 10px #000}
.luces{position:absolute;inset:-6px;border-radius:50%;border:2px dotted #FFD700;animation:rotar 10s linear infinite;pointer-events:none}
@keyframes rotar{to{transform:rotate(360deg)}}
.btn{margin:8px auto;border:0;padding:15px;width:90%;max-width:360px;border-radius:30px;font-weight:900;display:block;cursor:pointer;letter-spacing:0.5px}
#btnGirar{background:linear-gradient(90deg,#FFD700,#FFA000);color:#000;font-size:17px;box-shadow:0 5px 20px rgba(255,215,0,0.5);margin-top:20px}
#btnAnuncio{background:#2AABEE;color:#fff;font-size:14px}
#btnLike{background:#1877F2;color:#fff;font-size:14px}
#btnMensajePersonal{background:#fff;color:#000;border:2px solid #2AABEE}
#premioTexto{margin-top:10px;font-weight:900;color:#FFD700;min-height:20px;font-size:14px}
.boxMensaje{width:90%;max-width:360px;margin:18px auto;background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:12px}
.boxMensaje textarea{width:92%;height:70px;border-radius:10px;padding:10px;background:#0a0a0a;color:#fff;border:1px solid #444;resize:none;font-family:Arial}
#modal,#modalUsuario{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:99}
.caja{background:#fff;border:3px solid #FFD700;padding:22px;border-radius:18px;margin:20px;color:#000;width:85%;max-width:340px}
#modalUsuario input{width:90%;padding:12px;border-radius:10px;border:2px solid #FFD700;background:#f5f5f5;color:#000;font-weight:700;text-align:center;margin:12px 0}
</style>
</head>
<body>
<div class="header">🎰 DALEPLAY1 - RULETA DE LA SUERTE</div>
<div class="cont" id="ci">Intentos: 2 | Puntos: 0</div>
<div id="timer">⏳ Reinicio en: 60:00</div>

<div id="ruletaSection">
<div id="ruletaWrap">
<div class="luces"></div>
<div id="flecha"></div>
<canvas id="canvasRuleta" width="320" height="320"></canvas>
<div id="centro">DALE<br>PLAY</div>
</div>
<button id="btnGirar" class="btn">🎰 GIRAR RULETA</button>
<div id="premioTexto"></div>
</div>

<button id="btnAnuncio" class="btn">📺 VER ANUNCIO 0/2 PARA +1 INTENTO</button>
<button id="btnLike" class="btn">👍 ME GUSTA <span id="likeCount">0</span></button>

<div class="boxMensaje">
<p style="color:#FFD700;font-weight:900;margin:5px;font-size:13px">💬 ¿QUIERES HABLAR CONMIGO?</p>
<textarea id="txtPersonal" placeholder="Hola amigo..."></textarea>
<button id="btnMensajePersonal" class="btn">✉️ ENVIAR MENSAJE</button>
</div>

<div id="modal"><div class="caja"><h1 style="color:#2AABEE">¡GANASTE! 💎</h1><p>Código: <b id="cod"></b></p><p id="idTxt" style="font-size:12px"></p><button onclick="location.reload()" style="background:#FFD700;color:#000;padding:14px;width:100%;border-radius:10px;font-weight:900;border:0">RECLAMAR</button></div></div>
<div id="modalUsuario"><div class="caja"><h2 style="color:#2AABEE;margin:0">¡CASI LISTO!</h2><p style="font-size:14px">Escribe tu @usuario para darte el intento</p><input id="inputUsuario" type="text" placeholder="@tu_usuario"><button onclick="guardarUsuario()" style="background:#2AABEE;color:#fff;padding:14px;width:100%;border-radius:10px;font-weight:900;border:0;cursor:pointer">GUARDAR +1 INTENTO</button></div></div>

<script>
let tg = window.Telegram ? window.Telegram.WebApp : null;
let USER_ID='anon'; let USER_NAME='Jugador';
if(tg?.initDataUnsafe?.user){USER_ID=tg.initDataUnsafe.user.id.toString(); USER_NAME=tg.initDataUnsafe.user.first_name||'Jugador'; try{tg.expand();tg.ready();}catch(e){}}
function k(n){return 'dale_'+USER_ID+'_'+n;}
function safeShow(){return new Promise(r=>{try{if(typeof show_12010449!=='undefined'){show_12010449().then(()=>r()).catch(()=>r());}else{r();}}catch(e){r();}});}
const API_BASE='https://abacus.jasoncameron.dev';
async function getCounter(name){try{let res=await fetch(`${API_BASE}/get/daleplay1-${name}`);let d=await res.json();return d.value;}catch(e){return null;}}
async function hitCounter(name){try{let res=await fetch(`${API_BASE}/hit/daleplay1-${name}`);let d=await res.json();return d.value;}catch(e){return null;}}
let hoyKey=new Date().toLocaleDateString('es-CO',{timeZone:'America/Bogota'}).replace(/\//g,'-');
let hayGanadorGlobal=false;
function esSabadoHoy(){let d=new Date().toLocaleString('es-CO',{timeZone:'America/Bogota',weekday:'long'}).toLowerCase();return d.includes('sábado')||d.includes('sabado');}
(async()=>{let w=await getCounter('winner-'+hoyKey);hayGanadorGlobal=w&&w>0;await hitCounter('views-total');})();
let UNA_HORA=60*60*1000;
let horaGuardada=parseInt(localStorage.getItem(k('hora'))||'0');
if(!horaGuardada){horaGuardada=Date.now();localStorage.setItem(k('hora'),horaGuardada);}
setInterval(()=>{
let diff=(horaGuardada+UNA_HORA)-Date.now();
if(diff<=0){localStorage.setItem(k('intentos'),'2');localStorage.setItem(k('descubiertas'),'[]');localStorage.removeItem(k('ganadora'));localStorage.setItem(k('anuncios'),'0');localStorage.setItem(k('hora'),Date.now().toString());location.reload();return;}
let m=Math.floor(diff/60000);let s=Math.floor((diff%60000)/1000);
document.getElementById('timer').innerText=`⏳ Reinicio en: ${m}:${s.toString().padStart(2,'0')}`;
},1000);

// DATOS RULETA
let intentos=parseInt(localStorage.getItem(k('intentos'))||'2');
let puntos=parseInt(localStorage.getItem(k('puntos'))||'0');
let anuncios=parseInt(localStorage.getItem(k('anuncios'))||'0');
let ganadora=parseInt(localStorage.getItem(k('ganadora'))||'');
let segmentos=12; // 12 porciones = 1 de 12 chance
if(isNaN(ganadora)){ganadora=Math.floor(Math.random()*segmentos);localStorage.setItem(k('ganadora'),ganadora.toString());}

let canvas=document.getElementById('canvasRuleta'); let ctx=canvas.getContext('2d');
let girando=false; let anguloActual=0;
let colores=["#2AABEE","#E50914","#00C853","#FFAB00","#9C27B0","#FF6D00","#2AABEE","#E50914","#00C853","#FFAB00","#9C27B0","#FF6D00"];

function dibujarRuleta(){
let total=segmentos; let anguloPorcion=(2*Math.PI)/total;
ctx.clearRect(0,0,320,320);
for(let i=0;i<total;i++){
ctx.beginPath(); ctx.moveTo(160,160); ctx.arc(160,160,155,i*anguloPorcion,(i+1)*anguloPorcion); ctx.closePath();
ctx.fillStyle=colores[i]; ctx.fill(); ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.stroke();
ctx.save(); ctx.translate(160,160); ctx.rotate(i*anguloPorcion+anguloPorcion/2);
ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.font="900 12px Arial";
let texto = (i===ganadora) ? "💎 PREMIO" : "💣";
ctx.fillText(texto, 130, 4); ctx.restore();
}
}
dibujarRuleta();
function actualizarUI(){
document.getElementById('ci').innerText=`Intentos: ${intentos} | Puntos: ${puntos}`;
let btnAnuncio=document.getElementById('btnAnuncio');
if(anuncios>=2){btnAnuncio.innerText='✅ YA VISTE 2 ANUNCIOS';btnAnuncio.disabled=true;btnAnuncio.style.opacity='0.6';}
else{btnAnuncio.innerText=`📺 VER ANUNCIO ${anuncios}/2 PARA +1 INTENTO`;}
let btnGirar=document.getElementById('btnGirar');
if(intentos>0) btnGirar.innerText=`🎰 GIRAR RULETA (${intentos})`;
else btnGirar.innerText=`🚫 SIN INTENTOS - VE ANUNCIO`;
}
actualizarUI();

function sumarPuntos(c){puntos+=c;localStorage.setItem(k('puntos'),puntos.toString());}

async function girarRuleta(){
if(girando) return;
if(intentos<=0){alert("Sin intentos, ve un anuncio");return;}
if(!esSabadoHoy()){
// dia normal, siempre da puntos pero no premio grande
if(girando) return;
girando=true; intentos--; localStorage.setItem(k('intentos'),intentos.toString());
document.getElementById('btnGirar').disabled=true;
await safeShow();
let ganadorIndex=Math.floor(Math.random()*segmentos);
let anguloPorPremio=360/segmentos;
let vueltas=5*360;
let anguloFinal=360 - (ganadorIndex*anguloPorPremio + anguloPorPremio/2);
anguloActual+=vueltas+Math.random()*360;
canvas.style.transform=`rotate(${anguloActual+anguloFinal}deg)`;
setTimeout(()=>{
sumarPuntos(10); actualizarUI(); document.getElementById('premioTexto').innerText=`💣 Casi... +10 puntos`; girando=false; document.getElementById('btnGirar').disabled=false;
if(ganadorIndex===ganadora){localStorage.removeItem(k('ganadora')); ganadora=Math.floor(Math.random()*segmentos); localStorage.setItem(k('ganadora'),ganadora.toString()); setTimeout(dibujarRuleta,500);}
},4500);
return;
}
// SABADO - LOGICA GANADOR
if(hayGanadorGlobal){alert('¡YA HAY GANADOR HOY SÁBADO! Vuelve mañana');return;}
girando=true; intentos--; localStorage.setItem(k('intentos'),intentos.toString());
document.getElementById('btnGirar').disabled=true;
document.getElementById('btnGirar').innerText="GIRANDO...";
await safeShow();
let ganadorIndex=Math.floor(Math.random()*segmentos);
let anguloPorPremio=360/segmentos;
let vueltas=6*360;
let anguloFinal=360 - (ganadorIndex*anguloPorPremio + anguloPorPremio/2);
anguloActual+=vueltas;
canvas.style.transform=`rotate(${anguloActual+anguloFinal}deg)`;
setTimeout(async ()=>{
if(ganadorIndex===ganadora){
let check=await getCounter('winner-'+hoyKey);
if(check&&check>0){alert('Te ganaron por segundos.'); hayGanadorGlobal=true; girando=false; actualizarUI(); return;}
await hitCounter('winner-'+hoyKey); hayGanadorGlobal=true;
let codigo='SABADO-'+Math.floor(Math.random()*90000+10000);
let userFinal=localStorage.getItem(k('usuario_tg'))||USER_NAME;
document.getElementById('cod').innerText=codigo; document.getElementById('idTxt').innerText='ID:'+USER_ID+' | USER:'+userFinal;
document.getElementById('modal').style.display='flex'; sumarPuntos(500);
try{tg.sendData(`GANADOR|ID:${USER_ID}|USER:${userFinal}|COD:${codigo}`);}catch(e){}
}else{
sumarPuntos(10);
document.getElementById('premioTexto').innerText=`💣 Te tocó casi... +10 puntos`;
localStorage.removeItem(k('ganadora')); ganadora=Math.floor(Math.random()*segmentos); localStorage.setItem(k('ganadora'),ganadora.toString()); setTimeout(dibujarRuleta,500);
}
girando=false; actualizarUI();
},4600);
}
document.getElementById('btnGirar').onclick=girarRuleta;

// ANUNCIOS + USUARIO
let btnAnuncio=document.getElementById('btnAnuncio');
btnAnuncio.onclick=async()=>{
if(anuncios>=2) return;
btnAnuncio.innerText='⏳ CARGANDO ANUNCIO...'; btnAnuncio.disabled=true;
await safeShow();
document.getElementById('modalUsuario').style.display='flex';
btnAnuncio.innerText=`📺 VER ANUNCIO ${anuncios}/2 PARA +1 INTENTO`; btnAnuncio.disabled=false;
}
window.guardarUsuario=()=>{
let usuario=document.getElementById('inputUsuario').value.trim();
if(usuario.length<3){alert("Escribe tu usuario");return;}
if(!usuario.startsWith('@')) usuario='@'+usuario;
localStorage.setItem(k('usuario_tg'),usuario);
anuncios++; intentos++;
localStorage.setItem(k('anuncios'),anuncios.toString());
localStorage.setItem(k('intentos'),intentos.toString());
actualizarUI();
document.getElementById('modalUsuario').style.display='none';
try{tg.sendData(`NUEVO_USER|ID:${USER_ID}|USER:${usuario}`);}catch(e){}
}

// LIKES Y MENSAJES (igual que tuyo)
let btnLike=document.getElementById('btnLike');
function actualizarLikeUI(total, yaDioLike){if(yaDioLike){btnLike.innerHTML=`💙 TE GUSTA 👍 <span id="likeCount">${total ?? 0}</span>`;btnLike.style.background='#2AABEE';}else{btnLike.innerHTML=`👍 ME GUSTA <span id="likeCount">${total ?? 0}</span>`;btnLike.style.background='#1877F2';}}
async function cargarLikes(){let total=await getCounter('likes-total');if(total===null) total=parseInt(localStorage.getItem('likes-local')||'0');let yaDioLike=localStorage.getItem(k('like'))==='1';actualizarLikeUI(total,yaDioLike);} cargarLikes();
btnLike.onclick=async()=>{if(localStorage.getItem(k('like'))==='1'){alert("Ya le diste like bro 💙");return;}btnLike.innerText='⏳ CARGANDO ANUNCIO...';btnLike.disabled=true;await safeShow();let nuevo=await hitCounter('likes-total');if(nuevo===null){let localLikes=parseInt(localStorage.getItem('likes-local')||'0')+1;localStorage.setItem('likes-local',localLikes.toString());nuevo=localLikes;}localStorage.setItem(k('like'),'1');actualizarLikeUI(nuevo,true);btnLike.disabled=false;try{tg.sendData(`LIKE|ID:${USER_ID}|USER:${localStorage.getItem(k('usuario_tg'))||USER_NAME}`);}catch(e){}}
document.getElementById('btnMensajePersonal').onclick=async()=>{let txt=document.getElementById('txtPersonal').value.trim();if(txt.length<4){alert("Escribe tu mensaje primero");return;}let btn=document.getElementById('btnMensajePersonal');btn.innerText='⏳ CARGANDO ANUNCIO...';btn.disabled=true;await safeShow();let userFinal=localStorage.getItem(k('usuario_tg'))||USER_NAME;let mensajeCorto=txt.substring(0,400);try{tg.sendData(`MENSAJE_PERSONAL|ID:${USER_ID}|USER:${userFinal}|MSG:${mensajeCorto}`);alert("✅ Mensaje enviado!");document.getElementById('txtPersonal').value="";}catch(e){alert("Abre la app dentro de Telegram");}btn.innerText='✉️ ENVIAR MENSAJE';btn.disabled=false;}
setTimeout(()=>{safeShow();},4000);
let observador=new MutationObserver(()=>{let botones=document.querySelectorAll('button');botones.forEach(b=>{if(b.innerText.toLowerCase().includes('continuar')&&!b.dataset.cuenta){b.dataset.cuenta='1';let seg=10;let textoOriginal='Continuar';b.disabled=true;b.style.opacity='0.6';let timer=setInterval(()=>{if(seg>0){b.innerText=`Continuar en ${seg}s`;seg--;}else{b.innerText=textoOriginal;b.disabled=false;b.style.opacity='1';clearInterval(timer);}},1000);}});});observador.observe(document.body,{childList:true,subtree:true});
</script>
</body>
</html>
