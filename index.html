<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DALEPLAY FIX MORIR</title>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<script src="//libtl.com/sdk.js" data-zone="12010451" data-sdk="show_12010451"></script>
<style>
body{margin:0;background:#000;color:#fff;text-align:center;font-family:Arial;overflow:hidden}
#hud{display:flex;justify-content:space-between;background:#fff;color:#2AABEE;padding:8px;font-weight:900;margin:5px;border-radius:8px;font-size:13px}
canvas{border:2px solid #2AABEE;background:#000;display:block;margin:0 auto}
button{padding:14px;background:#2AABEE;color:#fff;border:0;border-radius:10px;font-weight:900;margin:5px;font-size:16px}
.controls button{width:80px;height:65px;font-size:28px;background:#fff;color:#2AABEE;border:2px solid #2AABEE}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999}
.box{background:#fff;color:#000;padding:22px;border-radius:16px;width:85%;max-width:300px}
</style>
</head>
<body>
<div id="hud"><span id="s">SCORE 0</span><span id="l">LVL 1</span><span id="m">$0.00</span></div>
<canvas id="g" width="360" height="450"></canvas>
<div id="status" style="font-size:11px;color:#0f0">12010449 + 12010451 LISTOS</div>
<div class="controls"><button id="L">◀</button><button id="F">🔥</button><button id="R">▶</button></div>

<div id="md" class="modal"><div class="box"><h2 style="color:#2AABEE">💀 MORISTE</h2><p id="dt"></p><button id="br">💰 VER ANUNCIO 12010449 - REVIVIR</button></div></div>
<div id="mw" class="modal"><div class="box"><h2 style="color:#2AABEE">🎉 NIVEL PASADO</h2><p id="wt"></p><button id="bn">💰 ANUNCIO 12010451 - SIGUIENTE</button></div></div>

<script>
let score=0,level=1,ads=0,paused=false,pl={x:170,y:410},bull=[],en=[],eb=[],keys={};
let c=document.getElementById('g'),x=c.getContext('2d');
function spawn(lv){en=[];for(let r=0;r<4;r++)for(let cc=0;cc<9;cc++)en.push({x:10+cc*38,y:30+r*25,a:true,dir:1})}
spawn(1);

function pagar(id){
  try{
    if(id===12010449 && typeof show_12010449!=='undefined') show_12010449();
    if(id===12010451 && typeof show_12010451!=='undefined') show_12010451();
  }catch(e){}
}

function morir(){ if(paused) return; paused=true; document.getElementById('dt').innerText=`Nivel ${level} | Score ${score}`; document.getElementById('md').style.display='flex'; }
function ganar(){ if(paused) return; paused=true; document.getElementById('wt').innerText=`Nivel ${level} Score ${score}`; document.getElementById('mw').style.display='flex'; }

document.getElementById('br').onclick=()=>{
  pagar(12010449);
  ads++; document.getElementById('m').innerText='$'+(ads*0.04).toFixed(2);
  // FIX DEL BUG DE TU FOTO - ESTO FALTABA:
  document.getElementById('md').style.display='none';
  bull=[]; eb=[]; pl.x=170;
  en.forEach(e=>{ e.y -= 80; if(e.y<20) e.y=20; }); // SUBE LOS ENEMIGOS PARA QUE NO TE MATEN AL REVIVIR
  paused=false;
  document.getElementById('status').innerText='✅ 12010449 PAGADO - REVIVISTE';
};

document.getElementById('bn').onclick=()=>{
  pagar(12010451);
  ads++; level++; score+=500;
  document.getElementById('l').innerText='LVL '+level;
  document.getElementById('s').innerText='SCORE '+score;
  document.getElementById('m').innerText='$'+(ads*0.04).toFixed(2);
  document.getElementById('mw').style.display='none';
  bull=[]; eb=[]; pl.x=170; spawn(level); paused=false;
};

function loop(){
 if(!paused){
  if(keys.L)pl.x-=5;if(keys.R)pl.x+=5;pl.x=Math.max(0,Math.min(336,pl.x));
  bull.forEach((b,i)=>{b.y-=8;if(b.y<0)bull.splice(i,1)});
  let edge=false;en.forEach(e=>{if(!e.a)return;e.x+=e.dir*(0.8+level*0.3);if(e.x<0||e.x>336)edge=true});
  if(edge)en.forEach(e=>{e.dir*=-1;e.y+=12});
  eb.forEach((b,i)=>{b.y+=3;if(b.y>460){eb.splice(i,1);return}if(b.x>pl.x&&b.x<pl.x+24&&b.y>pl.y&&b.y<pl.y+15){eb.splice(i,1);morir()}});
  bull.forEach((b,bi)=>{en.forEach(e=>{if(!e.a)return;if(b.x>e.x&&b.x<e.x+24&&b.y>e.y&&b.y<e.y+12){e.a=false;bull.splice(bi,1);score+=100;document.getElementById('s').innerText='SCORE '+score}})});
  if(en.every(e=>!e.a))ganar();if(en.some(e=>e.a&&e.y>390))morir();
 }
 x.clearRect(0,0,360,450);x.fillStyle='#0ff';x.fillRect(pl.x,410,24,10);
 x.fillStyle='#ff0';bull.forEach(b=>x.fillRect(b.x,b.y,3,10));
 x.fillStyle='#f00';eb.forEach(b=>x.fillRect(b.x,b.y,3,8));en.forEach(e=>{if(e.a){x.fillStyle='#f00';x.fillRect(e.x,e.y,24,10)}});
 requestAnimationFrame(loop);
}
loop();
document.getElementById('L').ontouchstart=e=>{e.preventDefault();keys.L=true};document.getElementById('L').ontouchend=e=>{keys.L=false};
document.getElementById('R').ontouchstart=e=>{e.preventDefault();keys.R=true};document.getElementById('R').ontouchend=e=>{keys.R=false};
document.getElementById('F').ontouchstart=e=>{e.preventDefault();if(!paused)bull.push({x:pl.x+10,y:410})};
setInterval(()=>{if(paused)return;let a=en.filter(e=>e.a);if(!a.length)return;let e=a[Math.floor(Math.random()*a.length)];eb.push({x:e.x+10,y:e.y})},700);
</script>
</body>
</html>
